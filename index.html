
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيشنت | PATIENT</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
 --sky:#35b8e6;
 --sky-dark:#087fae;
 --sky-light:#cceaf6;
 --white:#fff;
}

body{
 min-height:100vh;
 background:#fff;
 color:var(--sky);
 font-family:"Segoe UI",Tahoma,Arial,sans-serif;
 overflow-x:hidden;
 position:relative;
}

.medical-bg{
 position:fixed;
 inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:0;
}

.medical-symbol{
 position:absolute;
 color:var(--sky);
 opacity:.10;
 font-weight:300;
 user-select:none;
}

.symbol-1{top:13%;right:8%;font-size:65px}
.symbol-2{top:25%;left:9%;font-size:75px}
.symbol-3{top:48%;right:16%;font-size:45px}
.symbol-4{top:67%;left:13%;font-size:65px}
.symbol-5{bottom:8%;right:10%;font-size:75px}
.symbol-6{bottom:15%;left:30%;font-size:48px}
.symbol-7{top:8%;left:38%;font-size:38px}
.symbol-8{bottom:32%;right:42%;font-size:55px}

.circle{
 position:absolute;
 border:2px solid var(--sky);
 border-radius:50%;
 opacity:.08;
}

.circle-1{
 width:180px;
 height:180px;
 top:16%;
 left:-75px;
}

.circle-2{
 width:240px;
 height:240px;
 bottom:-110px;
 right:-80px;
}

.page{
 min-height:100vh;
 position:relative;
 z-index:1;
 display:flex;
 flex-direction:column;
}

header{
 height:82px;
 background:#fff;
 border-bottom:1px solid #e1f3fa;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:0 25px;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
}

.brand-logo{
 width:48px;
 height:48px;
}

.brand-logo svg{
 width:100%;
 height:100%;
}

.brand-name{
 display:flex;
 flex-direction:column;
 line-height:1.2;
}

.brand-name strong{
 color:#35b8e6;
 font-size:25px;
 font-weight:800;
}

.brand-name span{
 color:#087fae;
 font-size:12px;
 font-weight:700;
 letter-spacing:2px;
 direction:ltr;
}

main{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:45px 20px;
}

.portal-bar{
 width:min(1250px,100%);
 background:#fff;
 border:1px solid #cceaf6;
 border-radius:25px;
 box-shadow:0 15px 45px rgba(53,184,230,.10);
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 padding:22px;
 gap:16px;
}

.portal{
 text-decoration:none;
 background:#fff;
 border:1px solid #d5eff8;
 border-radius:19px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:15px;
 color:var(--sky);
 min-height:175px;
 transition:.25s ease;
 position:relative;
 overflow:hidden;
 padding:18px 10px;
}

.portal:hover{
 border-color:var(--sky);
 background:#f7fdff;
 transform:translateY(-5px);
 box-shadow:0 10px 25px rgba(53,184,230,.14);
}

.portal-icon{
 width:68px;
 height:68px;
 border-radius:20px;
 background:#eaf8ff;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
}

.portal-icon svg{
 width:36px;
 height:36px;
 stroke:var(--sky);
 stroke-width:1.8;
 fill:none;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.portal-title{
 font-size:18px;
 font-weight:800;
 color:var(--sky);
 text-align:center;
 line-height:1.5;
}

footer{
 text-align:center;
 padding:19px;
 color:#4aaac9;
 font-size:12px;
 border-top:1px solid #e8f6fb;
 background:#fff;
}

@media(max-width:1050px){
 .portal-bar{
  grid-template-columns:repeat(3,minmax(0,1fr));
  max-width:900px;
 }
}

@media(max-width:650px){
 header{height:72px}

 .brand-logo{
  width:43px;
  height:43px;
 }

 .brand-name strong{font-size:23px}

 main{padding:30px 14px}

 .portal-bar{
  grid-template-columns:repeat(2,minmax(0,1fr));
  padding:13px;
  gap:11px;
  border-radius:21px;
 }

 .portal{
  min-height:145px;
  gap:11px;
  padding:12px 5px;
 }

 .portal-icon{
  width:55px;
  height:55px;
  border-radius:16px;
 }

 .portal-icon svg{
  width:30px;
  height:30px;
 }

 .portal-title{font-size:15px}
}

@media(max-width:360px){
 .portal-title{font-size:14px}
 .portal{min-height:130px}
}
</style>
</head>

<body>

<div class="medical-bg">

 <div class="medical-symbol symbol-6">✚</div>

 <div class="medical-symbol symbol-8">✚</div>

 <div class="circle circle-2"></div>
</div>

<div class="page">

  <a class="portal" href="representative.html">

     <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
     <path d="M3 12h18M10 12v2h4v-2"/>
    </svg>
   </div>
   <span class="portal-title">بوابة المندوبين</span>
  </a>

 </div>

</main>

<footer>
 © 2026 PATIENT — جميع الحقوق محفوظة
</footer>

</div>

</body>
</html>
