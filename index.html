
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071827">
<title>IRAQ MEDICAL | بوابة المراجعين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#071827;
 color:#eef7f8;
 font-family:Tahoma,Arial,sans-serif;
 line-height:1.7;
}

main{
 max-width:850px;
 margin:25px auto;
 padding:15px;
}

.logo{text-align:center;margin-bottom:25px}
.logo h1{color:#25c5b2;letter-spacing:2px;font-size:29px}

.card{
 background:#10283a;
 border:1px solid #244457;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 12px 35px rgba(0,0,0,.12);
}

h2,h3{margin-top:0}

input,select,textarea{
 width:100%;
 padding:13px;
 margin:8px 0;
 border-radius:9px;
 border:1px solid #345468;
 background:#071827;
 color:white;
 font-size:15px;
}

button{
 width:100%;
 padding:13px;
 border:0;
 border-radius:9px;
 background:#20b9a8;
 color:#061923;
 font-weight:bold;
 margin-top:10px;
 cursor:pointer;
}

button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#244457;color:white}
.msg{color:#9ee8df;line-height:1.8;overflow-wrap:anywhere}
.hidden{display:none!important}

.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin:12px 0 18px;
}
.tabs button{margin:0}

/* بطاقات الأطباء العمودية */
.doctor{
 padding:14px;
 border:1px solid #345468;
 border-radius:15px;
 margin:14px 0;
 background:#0b2030;
}

.doctor-toggle{
 width:100%;
 display:flex;
 align-items:center;
 gap:14px;
 padding:0;
 margin:0;
 background:transparent;
 color:white;
 text-align:right;
 cursor:pointer;
}

.doctor-photo{
 width:85px;
 height:85px;
 min-width:85px;
 border-radius:13px;
 object-fit:cover;
 border:2px solid #20b9a8;
 background:#17394b;
}

.doctor-name{
 margin:0;
 color:#50d4c3;
 font-size:17px;
}

.doctor-specialty{
 color:#a8bdc9;
 font-size:13px;
 margin:5px 0 0;
}

.doctor-arrow{
 margin-right:auto;
 color:#50d4c3;
 font-size:22px;
}

.doctor-details{
 border-top:1px solid #345468;
 margin-top:14px;
 padding-top:12px;
}

.doctor-details.hidden{display:none!important}

.info{
 padding:9px;
 background:#071827;
 border-radius:8px;
 margin:6px 0;
 font-size:14px;
}

.small{font-size:13px;color:#a8bdc9}

.map-link{
 display:block;
 margin:12px 0;
 color:#50d4c3;
 text-decoration:none;
}

.map-link:hover{text-decoration:underline}

#booking{
 border-top:1px solid #345468;
 margin-top:18px;
 padding-top:18px;
}

.status-box{
 padding:15px;
 border-radius:10px;
 margin-top:10px;
}

.status-pending{background:#493d20;color:#ffe1a0}
.status-rejected{background:#49252d;color:#ffb4bf}
.status-approved{background:#123e39;color:#9ee8df}

@media(max-width:480px){
 main{padding:10px}
 .card{padding:15px}
 .doctor-photo{
  width:72px;
  height:72px;
  min-width:72px;
 }
 .doctor-name{font-size:15px}
}
</style>
</head>

<body>
<main>

<div class="logo">
 <h1>IRAQ MEDICAL</h1>
 <p>بوابتك الطبية الرقمية</p>
</div>

<section id="auth" class="card">

<h2>بوابة المراجع</h2>

<div class="tabs">
 <button type="button" id="signupTab" onclick="showAuthTab('signup')">إنشاء حساب</button>
 <button type="button" id="loginTab" class="secondary" onclick="showAuthTab('login')">تسجيل الدخول</button>
</div>

<div id="signupPanel">

<h3>إنشاء حساب مراجع جديد</h3>

<label>الاسم الكامل</label>
<input id="name" placeholder="الاسم الكامل" maxlength="150">

<label>رقم الهاتف (11 رقماً)</label>
<input id="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="07XXXXXXXXX">

<label>العمر</label>
<input id="age" type="number" min="1" max="120" placeholder="العمر">

<label>المحافظة</label>
<select id="governorate">
<option value="">اختر المحافظة</option>
<option value="بغداد">بغداد</option>
<option value="نينوى">نينوى</option>
<option value="البصرة">البصرة</option>
<option value="النجف">النجف</option>
<option value="كربلاء">كربلاء</option>
<option value="بابل">بابل</option>
<option value="القادسية">القادسية</option>
<option value="المثنى">المثنى</option>
<option value="ذي قار">ذي قار</option>
<option value="ميسان">ميسان</option>
<option value="واسط">واسط</option>
<option value="ديالى">ديالى</option>
<option value="صلاح الدين">صلاح الدين</option>
<option value="كركوك">كركوك</option>
<option value="الأنبار">الأنبار</option>
<option value="أربيل">أربيل</option>
<option value="السليمانية">السليمانية</option>
<option value="دهوك">دهوك</option>
<option value="حلبجة">حلبجة</option>
</select>

<label>البريد الإلكتروني</label>
<input id="signupEmail" type="email" placeholder="البريد الإلكتروني">

<label>كلمة المرور</label>
<input id="signupPassword" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)">

<button onclick="signup()">إنشاء الحساب</button>

</div>

<div id="loginPanel" class="hidden">

<h3>تسجيل الدخول</h3>

<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">

<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">تسجيل الدخول</button>

</div>

<p id="message" class="msg"></p>

</section>

<section id="status" class="card hidden">
<h2>حالة الحساب</h2>
<p id="statusText" class="msg"></p>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</section>

<section id="doctors" class="card hidden">

<h2>الأطباء المعتمدون</h2>
<p class="small">اضغط على بطاقة الطبيب للاطلاع على معلوماته وأوقات الدوام وحجز موعد.</p>

<div id="doctorList" class="msg">جاري تحميل الأطباء...</div>

<button class="secondary" onclick="logout()">تسجيل الخروج</button>

</section>

<section id="myAppointments" class="card hidden">

<h2>حجوزاتي</h2>

<div id="myAppointmentsList" class="msg">جاري تحميل الحجوزات...</div>

<button class="secondary" onclick="loadMyAppointments()">تحديث الحجوزات</button>

</section>

</main>

<script>
const SUPABASE_URL="https://oejkeqlqkwdfropylxsv.supabase.co";
const SUPABASE_KEY="sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const el=id=>document.getElementById(id);

let selectedDoctor=null;
let selectedSchedules=[];

const DEFAULT_DOCTOR_PHOTO=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
<rect width="160" height="160" rx="22" fill="#17394b"/>
<circle cx="80" cy="57" r="29" fill="#50d4c3"/>
<path d="M25 150c5-39 25-58 55-58s50 19 55 58" fill="#50d4c3"/>
<path d="M80 105v31m-15-15h30" stroke="#17394b" stroke-width="8" stroke-linecap="round"/>
</svg>
`);

function message(t){
 el("message").textContent=t;
}

function showAuthTab(tab){
 const signup=tab==="signup";

 el("signupPanel").classList.toggle("hidden",!signup);
 el("loginPanel").classList.toggle("hidden",signup);

 el("signupTab").classList.toggle("secondary",!signup);
 el("loginTab").classList.toggle("secondary",signup);

 message("");
}

async function signup(){

 const full_name=el("name").value.trim();
 const phone=el("phone").value.trim();
 const age=Number(el("age").value);
 const governorate=el("governorate").value;
 const email=el("signupEmail").value.trim();
 const password=el("signupPassword").value;

 if(!full_name||!phone||!age||age<1||age>120||
 !governorate||!email||password.length<6){

  message("أكمل جميع الحقول وتأكد من صحة العمر. كلمة المرور 6 أحرف على الأقل.");
  return;
 }

 if(!/^07[0-9]{9}$/.test(phone)){
  message("رقم الهاتف يجب أن يتكون من 11 رقماً ويبدأ بـ 07.");
  return;
 }

 message("جاري إنشاء الحساب...");

 const {error}=await db.auth.signUp({
  email,
  password,
  options:{
   data:{
    full_name,
    phone,
    age:String(age),
    governorate
   }
  }
 });

 if(error){
  message("تعذر إنشاء الحساب: "+error.message);
  return;
 }

 message("تم إرسال طلب التسجيل. سيبقى الحساب قيد موافقة الإدارة. تحقق من بريدك الإلكتروني إذا طُلب تأكيده.");
}

async function login(){

 const email=el("email").value.trim();
 const password=el("password").value;

 if(!email||!password){
  message("أدخل البريد الإلكتروني وكلمة المرور.");
  return;
 }

 message("جاري تسجيل الدخول...");

 const {error}=await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  message("تعذر تسجيل الدخول: "+error.message);
  return;
 }

 await loadAccount();
}

async function loadAccount(){

 const {data:{user}}=await db.auth.getUser();

 if(!user)return;

 const {data:profile,error}=await db.from("profiles")
 .select("full_name,role,approval_status")
 .eq("id",user.id)
 .maybeSingle();

 if(error){
  el("statusText").textContent="تعذر قراءة حالة الحساب: "+error.message;
  return;
 }

 if(!profile){
  el("statusText").textContent="لم يتم العثور على ملف الحساب. يرجى مراجعة الإدارة.";
  el("auth").classList.add("hidden");
  el("status").classList.remove("hidden");
  return;
 }

 el("auth").classList.add("hidden");
 el("status").classList.remove("hidden");
 el("doctors").classList.add("hidden");
 el("myAppointments").classList.add("hidden");

 if(profile.role!=="patient"){
  el("statusText").textContent="هذا الحساب ليس حساب مراجع.";
  return;
 }

 if(profile.approval_status==="rejected"){
  el("statusText").innerHTML=
  '<div class="status-box status-rejected">نأسف، تم رفض طلب إنشاء حسابك من الإدارة. يرجى التواصل مع الإدارة لمراجعة الطلب.</div>';
  return;
 }

 if(profile.approval_status!=="approved"){
  el("statusText").innerHTML=
  '<div class="status-box status-pending">مرحباً '+escapeHTML(profile.full_name||"بك")+'. حسابك قيد مراجعة الإدارة. ستظهر قائمة الأطباء بعد الموافقة.</div>';
  return;
 }

 el("status").classList.add("hidden");
 el("doctors").classList.remove("hidden");
 el("myAppointments").classList.remove("hidden");

 await loadDoctors();
 await loadMyAppointments();
}

/* تحميل الأطباء وعرضهم كبطاقات عمودية قابلة للفتح */
async function loadDoctors(){

 const list=el("doctorList");
 list.textContent="جاري تحميل الأطباء...";

 const {data:doctors,error}=await db.from("doctors")
 .select("id,profile_id,qualification,experience_years,consultation_fee,bio,photo_url,specialties(name_ar),clinics(name,address,phone,maps_url)");

 if(error){
  list.textContent="تعذر تحميل الأطباء: "+error.message;
  return;
 }

 if(!doctors||doctors.length===0){
  list.textContent="لا توجد سجلات أطباء في قاعدة البيانات.";
  return;
 }

 const profileIds=doctors.map(d=>d.profile_id).filter(Boolean);

 const {data:profiles,error:profileError}=await db.from("profiles")
 .select("id,full_name,role,approval_status,phone")
 .in("id",profileIds);

 if(profileError){
  list.textContent="تعذر تحميل أسماء الأطباء: "+profileError.message;
  return;
 }

 const approvedProfiles=(profiles||[]).filter(p=>
  p.role==="doctor"&&p.approval_status==="approved"
 );

 const approvedIds=new Set(approvedProfiles.map(p=>p.id));

 const visibleDoctors=doctors.filter(d=>
  approvedIds.has(d.profile_id)
 );

 if(visibleDoctors.length===0){
  list.textContent="لا يوجد أطباء معتمدون حالياً أو لا تسمح صلاحيات القراءة بعرضهم.";
  return;
 }

 list.innerHTML="";

 visibleDoctors.forEach(d=>{

  const profile=approvedProfiles.find(p=>p.id===d.profile_id);

  const item=document.createElement("div");
  item.className="doctor";

  /* رأس البطاقة */
  const toggle=document.createElement("button");
  toggle.type="button";
  toggle.className="doctor-toggle";
  toggle.setAttribute("aria-expanded","false");

  const photo=document.createElement("img");
  photo.className="doctor-photo";
  photo.alt="صورة الطبيب";
  photo.loading="lazy";
  photo.referrerPolicy="no-referrer";
  photo.src=d.photo_url||DEFAULT_DOCTOR_PHOTO;

  photo.onerror=()=>{
   photo.onerror=null;
   photo.src=DEFAULT_DOCTOR_PHOTO;
  };

  const nameArea=document.createElement("div");

  const title=document.createElement("h3");
  title.className="doctor-name";
  title.textContent=profile.full_name||"طبيب";

  const specialtyShort=document.createElement("p");
  specialtyShort.className="doctor-specialty";
  specialtyShort.textContent=d.specialties?.name_ar||"اختصاص غير محدد";

  nameArea.append(title,specialtyShort);

  const arrow=document.createElement("span");
  arrow.className="doctor-arrow";
  arrow.textContent="⌄";

  toggle.append(photo,nameArea,arrow);

  /* التفاصيل التي تظهر عند الضغط */
  const details=document.createElement("div");
  details.className="doctor-details hidden";

  function addInfo(label,value){
   const box=document.createElement("div");
   box.className="info";
   box.textContent=label+": "+(
    value!==null&&value!==undefined&&value!==""?value:"غير محدد"
   );
   details.appendChild(box);
  }

  addInfo("اسم الطبيب",profile.full_name);
  addInfo("الاختصاص",d.specialties?.name_ar);
  addInfo("العيادة",d.clinics?.name);
  addInfo("عنوان العيادة",d.clinics?.address);
  addInfo("هاتف العيادة",d.clinics?.phone);
  addInfo("المؤهل العلمي",d.qualification);
  addInfo("سنوات الخبرة",d.experience_years);
  addInfo("أجور الاستشارة",d.consultation_fee);

  if(d.bio){
   const bioTitle=document.createElement("h4");
   bioTitle.textContent="نبذة عن الطبيب";

   const bio=document.createElement("p");
   bio.className="small";
   bio.textContent=d.bio;

   details.append(bioTitle,bio);
  }

  /* رابط Google Maps */
  if(d.clinics?.maps_url){
   try{
    const mapUrl=new URL(d.clinics.maps_url);

    const validMap=
     mapUrl.protocol==="https:"&&
     (
      /(^|\.)google\.[^/]+$/i.test(mapUrl.hostname)||
      mapUrl.hostname==="maps.app.goo.gl"||
      mapUrl.hostname==="maps.google.com"
     );

    if(validMap){
     const mapLink=document.createElement("a");
     mapLink.className="map-link";
     mapLink.href=mapUrl.href;
     mapLink.target="_blank";
     mapLink.rel="noopener noreferrer";
     mapLink.textContent="عرض موقع العيادة على Google Maps";
     details.appendChild(mapLink);
    }
   }catch(e){}
  }

  /* زر حجز الموعد */
  const bookingButton=document.createElement("button");
  bookingButton.type="button";
  bookingButton.textContent="اختيار الطبيب وحجز موعد";
  bookingButton.onclick=()=>{
   selectDoctor(d,profile.full_name||"طبيب");
  };

  details.appendChild(bookingButton);

  /* فتح وإغلاق تفاصيل الطبيب */
  toggle.onclick=()=>{
   const isHidden=details.classList.toggle("hidden");
   toggle.setAttribute("aria-expanded",String(!isHidden));
   arrow.textContent=isHidden?"⌄":"⌃";
  };

  item.append(toggle,details);
  list.appendChild(item);
 });
}

async function selectDoctor(doctor,name){

 selectedDoctor=doctor;
 selectedSchedules=[];

 const existing=el("booking");
 if(existing)existing.remove();

 const panel=document.createElement("div");
 panel.id="booking";

 const heading=document.createElement("h3");
 heading.textContent="حجز موعد مع الطبيب: "+name;

 const scheduleMessage=document.createElement("p");
 scheduleMessage.className="small";
 scheduleMessage.id="scheduleMessage";
 scheduleMessage.textContent="جاري تحميل دوام الطبيب...";

 const dateLabel=document.createElement("label");
 dateLabel.textContent="تاريخ الموعد";

 const dateInput=document.createElement("input");
 dateInput.type="date";
 dateInput.id="appointmentDate";

 const timeLabel=document.createElement("label");
 timeLabel.textContent="وقت الموعد";

 const timeInput=document.createElement("input");
 timeInput.type="time";
 timeInput.id="appointmentTime";

 const notesLabel=document.createElement("label");
 notesLabel.textContent="ملاحظات للمراجع (اختياري)";

 const notesInput=document.createElement("textarea");
 notesInput.id="appointmentNotes";
 notesInput.rows=3;
 notesInput.placeholder="اكتب ملاحظاتك هنا";

 const bookButton=document.createElement("button");
 bookButton.id="bookButton";
 bookButton.textContent="إرسال طلب الحجز";

 const bookingMessage=document.createElement("p");
 bookingMessage.id="bookingMessage";
 bookingMessage.className="msg";

 panel.append(
  heading,
  scheduleMessage,
  dateLabel,
  dateInput,
  timeLabel,
  timeInput,
  notesLabel,
  notesInput,
  bookButton,
  bookingMessage
 );

 el("doctorList").prepend(panel);

 const today=new Date();

 const localToday=[
  today.getFullYear(),
  String(today.getMonth()+1).padStart(2,"0"),
  String(today.getDate()).padStart(2,"0")
 ].join("-");

 el("appointmentDate").min=localToday;
 el("appointmentDate").value=localToday;

 el("appointmentDate").addEventListener("change",checkSelectedDay);
 el("bookButton").addEventListener("click",bookAppointment);

 const {data,error}=await db.from("doctor_schedules")
 .select("day_of_week,start_time,end_time,is_available")
 .eq("doctor_id",doctor.id)
 .eq("is_available",true);

 if(error){
  el("scheduleMessage").textContent="تعذر تحميل الدوام: "+error.message;
  return;
 }

 selectedSchedules=data||[];

 if(selectedSchedules.length===0){
  el("scheduleMessage").textContent="الطبيب لم يحدد أوقات دوام متاحة حالياً.";
  el("bookButton").disabled=true;
  return;
 }

 checkSelectedDay();
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[char]);
}

function checkSelectedDay(){

 const dateValue=el("appointmentDate").value;

 if(!dateValue)return;

 const dayNumber=new Date(dateValue+"T12:00:00").getDay();

 const schedule=selectedSchedules.find(s=>
  Number(s.day_of_week)===dayNumber
 );

 if(!schedule){
  el("scheduleMessage").textContent="لا يوجد دوام متاح للطبيب في هذا اليوم. اختر يوماً آخر.";
  el("bookButton").disabled=true;
  return;
 }

 el("scheduleMessage").textContent=
 "دوام الطبيب في هذا اليوم من "+
 schedule.start_time.slice(0,5)+
 " إلى "+
 schedule.end_time.slice(0,5);

 el("bookButton").disabled=false;
}

async function bookAppointment(){

 if(!selectedDoctor)return;

 const dateValue=el("appointmentDate").value;
 const timeValue=el("appointmentTime").value;
 const notes=el("appointmentNotes").value.trim();

 if(!dateValue||!timeValue){
  el("bookingMessage").textContent="اختر تاريخ ووقت الموعد.";
  return;
 }

 const dayNumber=new Date(dateValue+"T12:00:00").getDay();

 const schedule=selectedSchedules.find(s=>
  Number(s.day_of_week)===dayNumber
 );

 if(!schedule){
  el("bookingMessage").textContent="لا يوجد دوام متاح للطبيب في هذا اليوم.";
  return;
 }

 if(
  timeValue<schedule.start_time.slice(0,5)||
  timeValue>=schedule.end_time.slice(0,5)
 ){
  el("bookingMessage").textContent="الوقت المختار خارج ساعات دوام الطبيب.";
  return;
 }

 const appointmentDate=new Date(dateValue+"T"+timeValue+":00");

 if(appointmentDate<=new Date()){
  el("bookingMessage").textContent="اختر موعداً في المستقبل.";
  return;
 }

 const {data:{user},error:authError}=await db.auth.getUser();

 if(authError||!user){
  el("bookingMessage").textContent="انتهت جلسة الدخول. سجل الدخول مجدداً.";
  return;
 }

 const button=el("bookButton");
 button.disabled=true;

 el("bookingMessage").textContent="جارٍ إرسال طلب الحجز...";

 const {error}=await db.from("appointments").insert({
  patient_id:user.id,
  doctor_id:selectedDoctor.id,
  appointment_at:appointmentDate.toISOString(),
  status:"pending",
  notes:notes||null
 });

 button.disabled=false;

 if(error){
  el("bookingMessage").textContent="تعذر إرسال الحجز: "+error.message;
  return;
 }

 el("bookingMessage").textContent=
 "تم إرسال طلب الحجز بنجاح. سيظهر للطبيب في لوحة الحجوزات.";

 await loadMyAppointments();
}

async function loadMyAppointments(){

 const {data:{user}}=await db.auth.getUser();

 if(!user)return;

 const list=el("myAppointmentsList");
 list.textContent="جاري تحميل الحجوزات...";

 const {data,error}=await db.from("appointments")
 .select("id,appointment_at,status,notes,doctors(profile_id)")
 .eq("patient_id",user.id)
 .order("appointment_at",{ascending:true});

 if(error){
  list.textContent="تعذر تحميل الحجوزات: "+error.message;
  return;
 }

 if(!data||data.length===0){
  list.textContent="ليس لديك حجوزات حالياً.";
  return;
 }

 const profileIds=data.map(a=>a.doctors?.profile_id).filter(Boolean);

 let profiles=[];

 if(profileIds.length){

  const result=await db.from("profiles")
  .select("id,full_name")
  .in("id",profileIds);

  if(!result.error)profiles=result.data||[];
 }

 list.innerHTML="";

 data.forEach(a=>{

  const card=document.createElement("div");
  card.className="doctor";

  const doctorProfile=profiles.find(p=>
   p.id===a.doctors?.profile_id
  );

  const date=new Date(a.appointment_at);

  const title=document.createElement("strong");
  title.textContent="الطبيب: "+(doctorProfile?.full_name||"غير معروف");

  const dateLine=document.createElement("p");
  dateLine.textContent="الموعد: "+
   date.toLocaleString("ar-IQ",{
    dateStyle:"medium",
    timeStyle:"short"
   });

  const status=document.createElement("p");
  status.className="msg";
  status.textContent="الحالة: "+appointmentStatus(a.status);

  card.append(title,dateLine,status);
  list.appendChild(card);
 });
}

function appointmentStatus(status){

 const labels={
  pending:"قيد الانتظار",
  approved:"مقبول",
  confirmed:"مؤكد",
  rejected:"مرفوض",
  cancelled:"ملغي",
  completed:"مكتمل"
 };

 return labels[status]||status||"غير محدد";
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session)loadAccount();
});
</script>
