
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRAQ MEDICAL | بوابة المراجعين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071827;color:#eef7f8;font-family:Arial,sans-serif}
main{max-width:650px;margin:25px auto;padding:15px}
.logo{text-align:center;margin-bottom:25px}
.logo h1{color:#25c5b2;letter-spacing:2px}
.card{background:#10283a;border:1px solid #244457;border-radius:18px;padding:20px;margin-bottom:18px}
input,select,textarea{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #345468;background:#071827;color:white;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#20b9a8;color:#061923;font-weight:bold;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#244457;color:white}
.msg{color:#9ee8df;line-height:1.8;overflow-wrap:anywhere}
.hidden{display:none!important}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px}
.tabs button{margin:0}
.doctor{padding:16px;border:1px solid #345468;border-radius:12px;margin:12px 0;background:#0b2030}
.doctor h3{color:#50d4c3;margin-bottom:10px}
.info{padding:9px;background:#071827;border-radius:8px;margin:6px 0;font-size:14px}
.small{font-size:13px;color:#a8bdc9}
#booking{border-top:1px solid #345468;margin-top:18px;padding-top:18px}
.status-rejected{color:#ff9ca8;background:#492632;border:1px solid #9e4656;padding:15px;border-radius:10px}
.status-pending{color:#f5d58a;background:#44391f;border:1px solid #88703b;padding:15px;border-radius:10px}
.status-approved{color:#9ee8df;background:#123e37;border:1px solid #287b6c;padding:15px;border-radius:10px}
</style>
</head>
<body>
<main>

<div class="logo">
<h1>IRAQ MEDICAL</h1>
<p>بوابتك الطبية الرقمية</p>
</div>

<section id="auth" class="card">
<h2>بوابة المراجع</h2>

<div class="tabs">
<button type="button" id="signupTab" onclick="showAuthTab('signup')">إنشاء حساب</button>
<button type="button" id="loginTab" class="secondary" onclick="showAuthTab('login')">تسجيل الدخول</button>
</div>

<div id="signupPanel">
<h3>إنشاء حساب مراجع جديد</h3>
<input id="name" placeholder="الاسم الكامل" maxlength="150" required>

<label for="phone">رقم الهاتف (11 رقماً بالضبط)</label>
<input id="phone" type="tel" inputmode="numeric" maxlength="11" minlength="11"
placeholder="مثال: 07XXXXXXXXX" autocomplete="tel" required>
<p class="small">يجب إدخال 11 رقماً، لا أكثر ولا أقل.</p>

<input id="age" type="number" min="1" max="120" placeholder="العمر" required>

<select id="governorate" required>
<option value="">اختر المحافظة</option>
<option value="بغداد">بغداد</option>
<option value="نينوى">نينوى</option>
<option value="البصرة">البصرة</option>
<option value="النجف">النجف</option>
<option value="كربلاء">كربلاء</option>
<option value="بابل">بابل</option>
<option value="القادسية">القادسية</option>
<option value="المثنى">المثنى</option>
<option value="ذي قار">ذي قار</option>
<option value="ميسان">ميسان</option>
<option value="واسط">واسط</option>
<option value="ديالى">ديالى</option>
<option value="صلاح الدين">صلاح الدين</option>
<option value="كركوك">كركوك</option>
<option value="الأنبار">الأنبار</option>
<option value="أربيل">أربيل</option>
<option value="السليمانية">السليمانية</option>
<option value="دهوك">دهوك</option>
<option value="حلبجة">حلبجة</option>
</select>

<input id="signupEmail" type="email" placeholder="البريد الإلكتروني" required>
<input id="signupPassword" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" required>
<button id="signupButton" onclick="signup()">إنشاء الحساب</button>
</div>

<div id="loginPanel" class="hidden">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">تسجيل الدخول</button>
</div>

<p id="message" class="msg"></p>
</section>

<section id="status" class="card hidden">
<h2>حالة الحساب</h2>
<p id="statusText" class="msg"></p>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</section>

<section id="doctors" class="card hidden">
<h2>الأطباء المعتمدون</h2>
<p class="small">اختر الطبيب المناسب للاطلاع على أوقات الدوام وحجز موعد.</p>
<div id="doctorList" class="msg">جاري تحميل الأطباء...</div>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</section>

<section id="myAppointments" class="card hidden">
<h2>حجوزاتي</h2>
<div id="myAppointmentsList" class="msg">جاري تحميل الحجوزات...</div>
<button class="secondary" onclick="loadMyAppointments()">تحديث الحجوزات</button>
</section>

</main>

<script>
const SUPABASE_URL="https://oejkeqlqkwdfropylxsv.supabase.co";
const SUPABASE_KEY="sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const el=id=>document.getElementById(id);
let selectedDoctor=null;
let selectedSchedules=[];

function message(t){
 el("message").textContent=t;
}

function normalizeDigits(value){
 return String(value)
 .replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
 .replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
 .replace(/\D/g,"");
}

el("phone").addEventListener("input",function(){
 const cleaned=normalizeDigits(this.value).slice(0,11);
 this.value=cleaned;
});

function showAuthTab(tab){
 const signup=tab==="signup";
 el("signupPanel").classList.toggle("hidden",!signup);
 el("loginPanel").classList.toggle("hidden",signup);
 el("signupTab").classList.toggle("secondary",!signup);
 el("loginTab").classList.toggle("secondary",signup);
 message("");
}

async function signup(){
 const full_name=el("name").value.trim();
 const phone=normalizeDigits(el("phone").value);
 const age=Number(el("age").value);
 const governorate=el("governorate").value;
 const email=el("signupEmail").value.trim();
 const password=el("signupPassword").value;

 if(!full_name||!age||age<1||age>120||!governorate||!email||password.length<6){
  message("أكمل جميع الحقول وتأكد من صحة العمر. كلمة المرور 6 أحرف على الأقل.");
  return;
 }

 if(!/^[0-9]{11}$/.test(phone)){
  message("رقم الهاتف يجب أن يتكون من 11 رقماً بالضبط.");
  el("phone").focus();
  return;
 }

 const button=el("signupButton");
 button.disabled=true;
 message("جاري إنشاء الحساب...");

 try{
  const {error}=await db.auth.signUp({
   email,
   password,
   options:{
    data:{
     full_name,
     phone,
     age:String(age),
     governorate
    }
   }
  });

  if(error)throw error;

  message("تم إرسال طلب التسجيل. سيبقى الحساب قيد موافقة الإدارة. تحقق من بريدك الإلكتروني إذا طُلب تأكيده.");
 }catch(error){
  message("تعذر إنشاء الحساب: "+error.message);
 }finally{
  button.disabled=false;
 }
}

async function login(){
 const email=el("email").value.trim();
 const password=el("password").value;

 if(!email||!password){
  message("أدخل البريد الإلكتروني وكلمة المرور.");
  return;
 }

 message("جاري تسجيل الدخول...");

 const {error}=await db.auth.signInWithPassword({email,password});

 if(error){
  message("تعذر تسجيل الدخول: "+error.message);
  return;
 }

 await loadAccount();
}

async function loadAccount(){
 const {data:{user},error:userError}=await db.auth.getUser();

 if(userError||!user){
  message("تعذر التحقق من جلسة الدخول. يرجى تسجيل الدخول مجدداً.");
  return;
 }

 const {data:profile,error}=await db.from("profiles")
 .select("full_name,role,approval_status")
 .eq("id",user.id)
 .maybeSingle();

 if(error){
  el("statusText").textContent="تعذر قراءة حالة الحساب: "+error.message;
  return;
 }

 if(!profile){
  el("statusText").textContent="لم يتم العثور على ملف الحساب. يرجى مراجعة الإدارة.";
  el("auth").classList.add("hidden");
  el("status").classList.remove("hidden");
  return;
 }

 el("auth").classList.add("hidden");
 el("status").classList.remove("hidden");
 el("doctors").classList.add("hidden");
 el("myAppointments").classList.add("hidden");

 if(profile.role!=="patient"){
  el("statusText").textContent="هذا الحساب ليس حساب مراجع.";
  return;
 }

 const name=profile.full_name||"بك";

 if(profile.approval_status==="rejected"){
  el("statusText").className="msg status-rejected";
  el("statusText").textContent="مرحباً "+name+". تم رفض طلب إنشاء حسابك من قبل الإدارة. يرجى التواصل مع الإدارة لمعرفة التفاصيل.";
  return;
 }

 if(profile.approval_status==="pending"){
  el("statusText").className="msg status-pending";
  el("statusText").textContent="مرحباً "+name+". حسابك قيد مراجعة الإدارة. ستظهر قائمة الأطباء بعد الموافقة.";
  return;
 }

 if(profile.approval_status!=="approved"){
  el("statusText").className="msg";
  el("statusText").textContent="مرحباً "+name+". حالة حسابك غير محددة. يرجى مراجعة الإدارة.";
  return;
 }

 el("status").classList.add("hidden");
 el("doctors").classList.remove("hidden");
 el("myAppointments").classList.remove("hidden");

 await loadDoctors();
 await loadMyAppointments();
}

async function loadDoctors(){
 const list=el("doctorList");
 list.textContent="جاري تحميل الأطباء...";

 const {data:doctors,error}=await db.from("doctors")
 .select("id,profile_id,qualification,experience_years,consultation_fee,bio,specialties(name_ar),clinics(name)");

 if(error){
  list.textContent="تعذر تحميل الأطباء: "+error.message;
  return;
 }

 if(!doctors||doctors.length===0){
  list.textContent="لا توجد سجلات أطباء في قاعدة البيانات.";
  return;
 }

 const profileIds=doctors.map(d=>d.profile_id).filter(Boolean);

 const {data:profiles,error:profileError}=await db.from("profiles")
 .select("id,full_name,role,approval_status,phone")
 .in("id",profileIds);

 if(profileError){
  list.textContent="تعذر تحميل أسماء الأطباء: "+profileError.message;
  return;
 }

 const approvedProfiles=(profiles||[]).filter(p=>
  p.role==="doctor"&&p.approval_status==="approved"
 );

 const approvedIds=new Set(approvedProfiles.map(p=>p.id));
 const visibleDoctors=doctors.filter(d=>approvedIds.has(d.profile_id));

 if(visibleDoctors.length===0){
  list.textContent="لا يوجد أطباء معتمدون حالياً أو لا تسمح صلاحيات القراءة بعرضهم.";
  return;
 }

 list.innerHTML="";

 visibleDoctors.forEach(d=>{
  const profile=approvedProfiles.find(p=>p.id===d.profile_id);
  const item=document.createElement("div");
  item.className="doctor";

  const title=document.createElement("h3");
  title.textContent=profile.full_name||"طبيب";

  const specialty=document.createElement("div");
  specialty.className="info";
  specialty.textContent="الاختصاص: "+(d.specialties?.name_ar||"غير محدد");

  const clinic=document.createElement("div");
  clinic.className="info";
  clinic.textContent="العيادة: "+(d.clinics?.name||"غير محددة");

  const qualification=document.createElement("div");
  qualification.className="info";
  qualification.textContent="المؤهل: "+(d.qualification||"غير محدد");

  const experience=document.createElement("div");
  experience.className="info";
  experience.textContent="سنوات الخبرة: "+(d.experience_years??"غير محدد");

  const fee=document.createElement("div");
  fee.className="info";
  fee.textContent="أجور الاستشارة: "+(d.consultation_fee??"غير محددة");

  const bio=document.createElement("p");
  bio.className="small";
  bio.textContent=d.bio||"";

  const button=document.createElement("button");
  button.textContent="اختيار الطبيب وحجز موعد";
  button.onclick=()=>selectDoctor(d,profile.full_name||"طبيب");

  item.append(title,specialty,clinic,qualification,experience,fee,bio,button);
  list.appendChild(item);
 });
}

async function selectDoctor(doctor,name){
 selectedDoctor=doctor;
 selectedSchedules=[];

 const existing=el("booking");
 if(existing)existing.remove();

 const panel=document.createElement("div");
 panel.id="booking";
 panel.innerHTML=`
 <h3>حجز موعد مع الطبيب: ${escapeHTML(name)}</h3>
 <p class="small" id="scheduleMessage">جاري تحميل دوام الطبيب...</p>
 <label>تاريخ الموعد</label>
 <input type="date" id="appointmentDate">
 <label>وقت الموعد</label>
 <input type="time" id="appointmentTime">
 <label>ملاحظات للمراجع (اختياري)</label>
 <textarea id="appointmentNotes" rows="3" placeholder="اكتب ملاحظاتك هنا"></textarea>
 <button id="bookButton">إرسال طلب الحجز</button>
 <p id="bookingMessage" class="msg"></p>
 `;

 el("doctorList").prepend(panel);

 const today=new Date();
 const localToday=[
  today.getFullYear(),
  String(today.getMonth()+1).padStart(2,"0"),
  String(today.getDate()).padStart(2,"0")
 ].join("-");

 el("appointmentDate").min=localToday;
 el("appointmentDate").value=localToday;

 el("appointmentDate").addEventListener("change",checkSelectedDay);
 el("bookButton").addEventListener("click",bookAppointment);

 const {data,error}=await db.from("doctor_schedules")
 .select("day_of_week,start_time,end_time,is_available")
 .eq("doctor_id",doctor.id)
 .eq("is_available",true);

 if(error){
  el("scheduleMessage").textContent="تعذر تحميل الدوام: "+error.message;
  return;
 }

 selectedSchedules=data||[];

 if(selectedSchedules.length===0){
  el("scheduleMessage").textContent="الطبيب لم يحدد أوقات دوام متاحة حالياً.";
  el("bookButton").disabled=true;
  return;
 }

 checkSelectedDay();
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[char]));
}

function checkSelectedDay(){
 const dateValue=el("appointmentDate").value;
 if(!dateValue)return;

 const dayNumber=new Date(dateValue+"T12:00:00").getDay();
 const schedule=selectedSchedules.find(s=>Number(s.day_of_week)===dayNumber);

 if(!schedule){
  el("scheduleMessage").textContent="لا يوجد دوام متاح للطبيب في هذا اليوم. اختر يوماً آخر.";
  el("bookButton").disabled=true;
  return;
 }

 el("scheduleMessage").textContent="دوام الطبيب في هذا اليوم من "+schedule.start_time.slice(0,5)+" إلى "+schedule.end_time.slice(0,5);
 el("bookButton").disabled=false;
}

async function bookAppointment(){
 if(!selectedDoctor)return;

 const dateValue=el("appointmentDate").value;
 const timeValue=el("appointmentTime").value;
 const notes=el("appointmentNotes").value.trim();

 if(!dateValue||!timeValue){
  el("bookingMessage").textContent="اختر تاريخ ووقت الموعد.";
  return;
 }

 const dayNumber=new Date(dateValue+"T12:00:00").getDay();
 const schedule=selectedSchedules.find(s=>Number(s.day_of_week)===dayNumber);

 if(!schedule){
  el("bookingMessage").textContent="لا يوجد دوام متاح للطبيب في هذا اليوم.";
  return;
 }

 if(timeValue<schedule.start_time.slice(0,5)||timeValue>=schedule.end_time.slice(0,5)){
  el("bookingMessage").textContent="الوقت المختار خارج ساعات دوام الطبيب.";
  return;
 }

 const appointmentDate=new Date(dateValue+"T"+timeValue+":00");

 if(appointmentDate<=new Date()){
  el("bookingMessage").textContent="اختر موعداً في المستقبل.";
  return;
 }

 const {data:{user},error:authError}=await db.auth.getUser();

 if(authError||!user){
  el("bookingMessage").textContent="انتهت جلسة الدخول. سجل الدخول مجدداً.";
  return;
 }

 const button=el("bookButton");
 button.disabled=true;
 el("bookingMessage").textContent="جارٍ إرسال طلب الحجز...";

 const {error}=await db.from("appointments").insert({
  patient_id:user.id,
  doctor_id:selectedDoctor.id,
  appointment_at:appointmentDate.toISOString(),
  status:"pending",
  notes:notes||null
 });

 button.disabled=false;

 if(error){
  el("bookingMessage").textContent="تعذر إرسال الحجز: "+error.message;
  return;
 }

 el("bookingMessage").textContent="تم إرسال طلب الحجز بنجاح. سيظهر للطبيب في لوحة الحجوزات.";
 await loadMyAppointments();
}

async function loadMyAppointments(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;

 const list=el("myAppointmentsList");
 list.textContent="جاري تحميل الحجوزات...";

 const {data,error}=await db.from("appointments")
 .select("id,appointment_at,status,notes,doctors(profile_id)")
 .eq("patient_id",user.id)
 .order("appointment_at",{ascending:true});

 if(error){
  list.textContent="تعذر تحميل الحجوزات: "+error.message;
  return;
 }

 if(!data||data.length===0){
  list.textContent="ليس لديك حجوزات حالياً.";
  return;
 }

 const profileIds=data.map(a=>a.doctors?.profile_id).filter(Boolean);
 let profiles=[];

 if(profileIds.length){
  const result=await db.from("profiles")
  .select("id,full_name")
  .in("id",profileIds);

  if(!result.error)profiles=result.data||[];
 }

 list.innerHTML="";

 data.forEach(a=>{
  const card=document.createElement("div");
  card.className="doctor";

  const doctorProfile=profiles.find(p=>p.id===a.doctors?.profile_id);
  const date=new Date(a.appointment_at);

  const title=document.createElement("strong");
  title.textContent="الطبيب: "+(doctorProfile?.full_name||"غير معروف");

  const dateLine=document.createElement("p");
  dateLine.textContent="الموعد: "+date.toLocaleString("ar-IQ",{dateStyle:"medium",timeStyle:"short"});

  const status=document.createElement("p");
  status.className="msg";
  status.textContent="الحالة: "+appointmentStatus(a.status);

  card.append(title,dateLine,status);
  list.appendChild(card);
 });
}

function appointmentStatus(status){
 const labels={
  pending:"قيد الانتظار",
  approved:"مقبول",
  confirmed:"مؤكد",
  rejected:"مرفوض",
  cancelled:"ملغي",
  completed:"مكتمل"
 };
 return labels[status]||status||"غير محدد";
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session)loadAccount();
});
</script>
</body>
</html>
