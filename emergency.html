<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة طبيب الطوارئ | PATIENT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;background:#f5fbfe;
 font-family:"Segoe UI",Tahoma,Arial,sans-serif;
 color:#087fae;display:flex;align-items:center;
 justify-content:center;padding:20px;
}
.container{
 width:100%;max-width:440px;background:#fff;
 border:1px solid #d9eff8;border-radius:24px;
 padding:32px;box-shadow:0 15px 45px rgba(20,140,180,.10);
}
.logo{
 width:70px;height:70px;border-radius:22px;
 background:#e8f8ff;color:#27addb;
 display:flex;align-items:center;justify-content:center;
 font-size:38px;margin:0 auto 18px;
}
h1{text-align:center;font-size:25px;margin-bottom:8px}
.subtitle{text-align:center;color:#6c9eaf;font-size:14px;margin-bottom:27px}
label{display:block;font-weight:700;margin:15px 0 8px}
input{
 width:100%;height:49px;border:1px solid #d5eaf2;
 border-radius:12px;padding:0 13px;font-size:15px;
 outline:none;direction:ltr;text-align:left;
}
input:focus{border-color:#35b8e6;box-shadow:0 0 0 3px #e7f8ff}
button{
 width:100%;height:50px;border:0;border-radius:12px;
 background:#35b8e6;color:white;font-size:16px;
 font-weight:800;cursor:pointer;margin-top:22px;
}
button:disabled{opacity:.6;cursor:wait}
.message{
 display:none;margin-top:17px;padding:12px;
 border-radius:10px;font-size:14px;line-height:1.7;
}
.error{display:block;background:#fff0f0;color:#b42318}
.success{display:block;background:#eaf9f0;color:#187343}
.back{
 display:block;text-align:center;margin-top:22px;
 color:#168db7;text-decoration:none;font-size:14px;
}
#account{display:none;text-align:center;margin-top:22px}
#account button{background:#eaf8ff;color:#087fae}
</style>
</head>
<body>

<div class="container">
 <div class="logo">✚</div>
 <h1>بوابة طبيب الطوارئ</h1>
 <p class="subtitle">تسجيل دخول الحساب المستقل لطبيب الطوارئ</p>

 <form id="loginForm">
  <label for="email">البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="username"
   placeholder="doctor@example.com" required>

  <label for="password">كلمة المرور</label>
  <input id="password" type="password"
   autocomplete="current-password" placeholder="كلمة المرور" required>

  <button id="loginButton" type="submit">تسجيل الدخول</button>
 </form>

 <div id="message" class="message"></div>

 <div id="account">
  <h3 id="welcome"></h3>
  <p style="margin-top:10px;color:#648c9a">
   تم التحقق من حساب طبيب الطوارئ.
  </p>
  <p style="margin-top:10px;font-size:13px;color:#648c9a">
   واجهة إدارة حالات الطوارئ والمحادثات تُستكمل في مرحلة الربط التالية.
  </p>
  <button id="logoutButton" type="button">تسجيل الخروج</button>
 </div>

 <a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
</div>

<script>
const SUPABASE_URL = "https://oejkeqlqkwdfropylxsv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
const account = document.getElementById("account");
const welcome = document.getElementById("welcome");

function showMessage(text, type){
 message.textContent = text;
 message.className = "message " + type;
}

function clearMessage(){
 message.textContent = "";
 message.className = "message";
}

function showAccount(name){
 form.style.display = "none";
 account.style.display = "block";
 welcome.textContent = "مرحباً، " + (name || "طبيب الطوارئ");
}

form.addEventListener("submit", async function(event){
 event.preventDefault();
 clearMessage();

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 loginButton.disabled = true;
 loginButton.textContent = "جارٍ التحقق...";

 try{
  const {data,error} = await db.auth.signInWithPassword({
   email:email,
   password:password
  });

  if(error) throw error;

  const user = data.user;

  const {data:profile,error:profileError} = await db
   .from("profiles")
   .select("full_name,role,approval_status")
   .eq("id",user.id)
   .maybeSingle();

  if(profileError) throw profileError;

  if(!profile || profile.role !== "emergency_doctor"){
   await db.auth.signOut();
   throw new Error("هذا الحساب ليس حساب طبيب طوارئ.");
  }

  if(profile.approval_status !== "approved"){
   await db.auth.signOut();
   throw new Error("حسابك غير معتمد من الإدارة حتى الآن.");
  }

  showMessage("تم تسجيل الدخول والتحقق من صلاحية الحساب.", "success");
  showAccount(profile.full_name);

 }catch(error){
  showMessage(error.message || "تعذر تسجيل الدخول. حاول مرة أخرى.", "error");
 }finally{
  loginButton.disabled = false;
  loginButton.textContent = "تسجيل الدخول";
 }
});

document.getElementById("logoutButton").addEventListener("click", async function(){
 await db.auth.signOut();
 window.location.reload();
});
</script>
</body>
</html>
