<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATIENT | مقدم الخدمة المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:850px;margin:auto;padding:24px}section,article{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcdce9;min-height:44px;box-sizing:border-box}input{display:block;width:100%;margin:8px 0}button{background:#087fae;color:white;cursor:pointer}a{color:#087fae}</style><main><a href="index.html">الرئيسية</a><h1>بوابة مقدم الخدمة المنزلية</h1><p id="notice" role="status"></p><section id="login"><form id="form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required><label for="password">كلمة المرور</label><input id="password" type="password" required><button>تسجيل الدخول</button></form></section><section id="dashboard" hidden><h2 id="name"></h2><button id="refresh">تحديث الطلبات</button> <button id="logout">خروج</button><div id="requests"></div></section></main><script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");const el=id=>document.getElementById(id);const say=t=>el('notice').textContent=t;let provider;
const labels={pending:'جديد',quoted:'بانتظار قبول المراجع',confirmed:'مؤكد',en_route:'في الطريق',arrived:'وصل',completed:'مكتمل',results_ready:'النتائج جاهزة',cancelled:'ملغي'};
async function action(id,status,price=null,time=null){const {error}=await db.rpc('home_service_progress',{p_request:id,p_status:status,p_price:price,p_time:time});say(error?error.message:'تم تحديث الطلب');await load()}
async function load(){if(!provider)return;const {data,error}=await db.from('home_service_requests').select('id,description,status,quoted_price,scheduled_at').eq('provider_id',provider.id).order('created_at',{ascending:false});if(error){say(error.message);return}el('requests').replaceChildren();for(const r of data){const a=document.createElement('article');const p=document.createElement('p');p.textContent=r.description+' — '+(labels[r.status]||r.status);a.append(p);if(r.scheduled_at){const q=document.createElement('p');q.textContent=r.quoted_price+' د.ع — '+new Date(r.scheduled_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'});a.append(q)}if(r.status==='pending'){const f=document.createElement('form');const price=document.createElement('input');price.type='number';price.min='0';price.step='1';price.required=true;price.setAttribute('aria-label','السعر بالدينار');price.placeholder='السعر بالدينار';const time=document.createElement('input');time.type='datetime-local';time.required=true;time.setAttribute('aria-label','موعد الزيارة بتوقيت بغداد');const l=document.createElement('label');l.textContent='موعد الزيارة بتوقيت بغداد';const b=document.createElement('button');b.textContent='إرسال العرض';f.append(price,l,time,b);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await action(r.id,'quoted',Number(price.value),new Date(time.value+':00+03:00').toISOString())}finally{b.disabled=false}};a.append(f)}const next={confirmed:['en_route','الانطلاق'],en_route:['arrived','تم الوصول'],arrived:['completed','إكمال الزيارة']}[r.status];if(next){const b=document.createElement('button');b.textContent=next[1];b.onclick=async()=>{b.disabled=true;try{await action(r.id,next[0])}finally{b.disabled=false}};a.append(b);const {data:loc}=await db.from('home_service_locations').select('latitude,longitude').eq('request_id',r.id).maybeSingle();if(loc){const q=document.createElement('a');q.textContent=' فتح موقع الزيارة';q.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc.latitude+','+loc.longitude);q.target='_blank';q.rel='noopener noreferrer';a.append(q)}}el('requests').append(a)}}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data,error}=await db.from('home_service_providers').select('id,display_name,approved,subscription_expires_at').eq('account_id',session.user.id).maybeSingle();if(error||!data?.approved){say('الحساب غير معتمد كمقدم خدمة');return}provider=data;el('login').hidden=true;el('dashboard').hidden=false;el('name').textContent=data.display_name;if(!data.subscription_expires_at||new Date(data.subscription_expires_at)<=new Date())say('الاشتراك منتهٍ؛ يمكنك متابعة الطلبات السابقة وفق الصلاحيات');await load()}
el('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)say('تعذر تسجيل الدخول');else await boot()};el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};boot();
</script></html>
