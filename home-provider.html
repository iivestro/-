<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATIENT | مقدم الخدمة المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:850px;margin:auto;padding:24px}section,article{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcdce9;min-height:44px;box-sizing:border-box}input{display:block;width:100%;margin:8px 0}button{background:#087fae;color:white;cursor:pointer}a{color:#087fae}</style><style> :root{color-scheme:light;--brand:#036b91;--ink:#173b52;--line:#d6e8ef}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at top right,#dff5ff,transparent 55%),#f4f9fc;color:var(--ink);line-height:1.75}main{max-width:980px;padding:clamp(16px,4vw,36px);margin:auto}main>h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.7px;color:#075575;margin:24px 0 4px}main>a:first-child{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:bold}main>p{color:#476779}section,form{border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 8px 30px #164e6310;background:#fff}section section,section form{background:#f8fcfe;box-shadow:none;border-radius:16px}h2{font-size:21px;color:#075575;margin-top:0}h3{color:#075575}label{font-weight:600;color:#294b60}input,select,textarea{background:#f7fbfd;border:1px solid #b7d5e2;border-radius:12px;color:#173b52;max-width:100%;min-height:48px}input:focus,select:focus,textarea:focus{outline:3px solid #bae6fd;border-color:#0284c7}button{border:0;border-radius:12px;background:linear-gradient(135deg,#036b91,#087fae);color:white;font-weight:bold;min-height:46px;padding:12px 18px;margin:4px 0 4px 6px;box-shadow:0 4px 12px #036b9120;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}#notice:not(:empty){background:#e8f5fb;border:1px solid #c1e4f4;border-radius:12px;padding:12px 16px} [hidden]{display:none!important}@media(max-width:520px){main{padding:16px}section,form{padding:16px}button{max-width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><a href="index.html">الرئيسية</a><h1>بوابة مقدم الخدمة المنزلية</h1><p id="notice" role="status"></p><section id="login"><form id="form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required><label for="password">كلمة المرور</label><input id="password" type="password" required><button>تسجيل الدخول</button></form></section><section id="dashboard" hidden><h2 id="name"></h2><button id="refresh">تحديث الطلبات</button> <button id="logout">خروج</button><div id="requests"></div></section></main><script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");const el=id=>document.getElementById(id);const say=t=>el('notice').textContent=t;let provider;
const labels={pending:'جديد',quoted:'بانتظار قبول المراجع',confirmed:'مؤكد',en_route:'في الطريق',arrived:'وصل',completed:'مكتمل',results_ready:'النتائج جاهزة',cancelled:'ملغي'};
async function action(id,status,price=null,time=null){const {error}=await db.rpc('home_service_progress',{p_request:id,p_status:status,p_price:price,p_time:time});say(error?error.message:'تم تحديث الطلب');await load()}
async function documents(container,id,folder,upload,publish=false){const bucket=db.storage.from('home-service-documents');const prefix=id+'/'+folder;const {data,error}=await bucket.list(prefix);if(!error)for(const file of data||[]){if(!file.id)continue;const b=document.createElement('button');b.textContent=folder==='result'?'عرض نتيجة التحليل':'عرض الوصفة';b.onclick=async()=>{const {data,error}=await bucket.download(prefix+'/'+file.name);if(error){say(error.message);return}const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};container.append(b)}if(upload){const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png';input.setAttribute('aria-label',folder==='result'?'ملف نتيجة التحليل':'صورة الوصفة');const b=document.createElement('button');b.textContent=folder==='result'?'رفع النتيجة':'رفع الوصفة';b.onclick=async()=>{const f=input.files[0];if(!f||f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type)){say('اختر ملف PDF أو صورة لا تتجاوز 10 ميغابايت');return}b.disabled=true;try{const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png'}[f.type];const {error}=await bucket.upload(prefix+'/'+crypto.randomUUID()+'.'+ext,f,{contentType:f.type});if(error)throw error;say('تم رفع الملف');await load()}catch(e){say(e.message)}finally{b.disabled=false}};container.append(input,b)}if(publish){const b=document.createElement('button');b.textContent='إتاحة النتائج للمراجع';b.onclick=async()=>{const {error}=await db.rpc('home_service_publish_results',{p_request:id});say(error?error.message:'تم إتاحة النتائج');await load()};container.append(b)}}
async function load(){if(!provider)return;const {data,error}=await db.from('home_service_requests').select('id,description,status,quoted_price,scheduled_at').eq('provider_id',provider.id).order('created_at',{ascending:false});if(error){say(error.message);return}el('requests').replaceChildren();for(const r of data){const a=document.createElement('article');const p=document.createElement('p');p.textContent=r.description+' — '+(labels[r.status]||r.status);a.append(p);if(r.scheduled_at){const q=document.createElement('p');q.textContent=r.quoted_price+' د.ع — '+new Date(r.scheduled_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'});a.append(q)}if(r.status==='pending'){const f=document.createElement('form');const price=document.createElement('input');price.type='number';price.min='0';price.step='1';price.required=true;price.setAttribute('aria-label','السعر بالدينار');price.placeholder='السعر بالدينار';const time=document.createElement('input');time.type='datetime-local';time.required=true;time.setAttribute('aria-label','موعد الزيارة بتوقيت بغداد');const l=document.createElement('label');l.textContent='موعد الزيارة بتوقيت بغداد';const b=document.createElement('button');b.textContent='إرسال العرض';f.append(price,l,time,b);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await action(r.id,'quoted',Number(price.value),new Date(time.value+':00+03:00').toISOString())}finally{b.disabled=false}};a.append(f)}const next={confirmed:['en_route','الانطلاق'],en_route:['arrived','تم الوصول'],arrived:['completed','إكمال الزيارة']}[r.status];if(next){const b=document.createElement('button');b.textContent=next[1];b.onclick=async()=>{b.disabled=true;try{await action(r.id,next[0])}finally{b.disabled=false}};a.append(b);const {data:loc}=await db.from('home_service_locations').select('latitude,longitude').eq('request_id',r.id).maybeSingle();if(loc){const q=document.createElement('a');q.textContent=' فتح موقع الزيارة';q.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc.latitude+','+loc.longitude);q.target='_blank';q.rel='noopener noreferrer';a.append(q)}}await documents(a,r.id,'prescription',false);if(provider.kind==='laboratory'&&['completed','results_ready'].includes(r.status))await documents(a,r.id,'result',r.status==='completed',r.status==='completed');el('requests').append(a)}}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data,error}=await db.from('home_service_providers').select('id,kind,display_name,approved,subscription_expires_at').eq('account_id',session.user.id).maybeSingle();if(error||!data?.approved){say('الحساب غير معتمد كمقدم خدمة');return}provider=data;el('login').hidden=true;el('dashboard').hidden=false;el('name').textContent=data.display_name;if(!data.subscription_expires_at||new Date(data.subscription_expires_at)<=new Date())say('الاشتراك منتهٍ؛ يمكنك متابعة الطلبات السابقة وفق الصلاحيات');await load()}
el('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)say('تعذر تسجيل الدخول');else await boot()};el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};boot();
</script></html>
