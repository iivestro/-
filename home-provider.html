<link rel="stylesheet" href="balsam-demo/balsam-theme.css?v=20261126-balsam"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALSAM | مقدم الخدمة المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:850px;margin:auto;padding:24px}section,article{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcdce9;min-height:44px;box-sizing:border-box}input{display:block;width:100%;margin:8px 0}button{background:#087fae;color:white;cursor:pointer}a{color:#087fae}</style><style> :root{color-scheme:light;--brand:#036b91;--ink:#173b52;--line:#d6e8ef}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at top right,#dff5ff,transparent 55%),#f4f9fc;color:var(--ink);line-height:1.75}main{max-width:980px;padding:clamp(16px,4vw,36px);margin:auto}main>h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.7px;color:#075575;margin:24px 0 4px}main>a:first-child{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:bold}main>p{color:#476779}section,form{border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 8px 30px #164e6310;background:#fff}section section,section form{background:#f8fcfe;box-shadow:none;border-radius:16px}h2{font-size:21px;color:#075575;margin-top:0}h3{color:#075575}label{font-weight:600;color:#294b60}input,select,textarea{background:#f7fbfd;border:1px solid #b7d5e2;border-radius:12px;color:#173b52;max-width:100%;min-height:48px}input:focus,select:focus,textarea:focus{outline:3px solid #bae6fd;border-color:#0284c7}button{border:0;border-radius:12px;background:linear-gradient(135deg,#036b91,#087fae);color:white;font-weight:bold;min-height:46px;padding:12px 18px;margin:4px 0 4px 6px;box-shadow:0 4px 12px #036b9120;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}#notice:not(:empty){background:#e8f5fb;border:1px solid #c1e4f4;border-radius:12px;padding:12px 16px} [hidden]{display:none!important}@media(max-width:520px){main{padding:16px}section,form{padding:16px}button{max-width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><style>
/* BALSAM — unified medical identity */
:root{--primary:#087f83;--dark:#12656c;--light:#e8f7f5;--page:#f4faf9;--text:#173e4a;--muted:#506d77;--border:#dcebea;--navy:#153b49;--shadow:0 12px 32px rgba(16,74,78,.08)}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 95% 0%,#def3f0 0,transparent 38%),#f4faf9;line-height:1.75}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 4px 20px #123b4909}
.topbar-inner{max-width:1150px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;color:#153b49;font-weight:800;line-height:1.45;min-width:0}
.brand-mark{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#12a6a0,#08777e);box-shadow:0 6px 18px #087f8326}
.brand-mark svg{width:25px;height:25px}

.top-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid #cde5e1;border-radius:12px;background:#f1f9f8;color:#12656c;font-weight:700;font-size:13px;padding:8px 13px;text-decoration:none;white-space:nowrap}
.top-link svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1050px;margin:auto;padding:24px 18px 65px}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:178px;padding:30px;border:0;border-radius:24px;color:#fff;background:linear-gradient(120deg,#125863,#087f83 62%,#129e96);box-shadow:0 16px 36px #087f8324;margin:0 0 22px}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border:1px solid #ffffff26;border-radius:50%;pointer-events:none}
.hero:before{width:300px;height:300px;left:-110px;top:-170px;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff06}
.hero:after{width:190px;height:190px;right:10%;bottom:-140px}
.hero-content{position:relative;z-index:1;min-width:0}
.hero-tag{display:inline-block;padding:4px 11px;color:white;background:#ffffff18;border:1px solid #ffffff30;border-radius:24px;font-size:12px}
.hero h1{margin:8px 0;font-size:clamp(25px,4vw,36px);line-height:1.4;color:#fff}
.hero p{font-size:14px;color:#f0fffd;margin:0;line-height:1.85}
.hero-art{display:grid;place-items:center;width:92px;height:92px;flex:0 0 92px;border:1px solid #ffffff38;border-radius:24px;background:#ffffff13;color:#e5fffa}
.hero-art svg{width:52px;height:52px;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;fill:none}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.card h2,h2{color:var(--navy);line-height:1.45}
label{color:#335663;font-weight:700}
input,select,textarea{font-size:16px;min-height:46px;border:1px solid #cde2e4;background:#fbfdfd;border-radius:12px;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#087f83;box-shadow:0 0 0 3px #087f831b}
button{font-family:inherit;min-height:44px;background:linear-gradient(135deg,#087f83,#076c77);color:white;border-radius:12px;font-size:14px}
button.secondary{background:#eaf6f4;color:#12656c;border:1px solid #cde5e1;box-shadow:none}
button:focus-visible,a:focus-visible{outline:3px solid #36a69d;outline-offset:3px}
.tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#signupPanel>button,#loginPanel>button{width:100%}
@media(max-width:650px){main{padding:16px 13px 65px}.topbar-inner{padding:10px 13px}.brand{font-size:15px}.brand-mark{width:38px;height:38px}.brand-sub{font-size:11px}.top-link{font-size:12px;padding:7px 11px}.hero{min-height:155px;padding:22px 19px;gap:10px;border-radius:22px}.hero-art{width:64px;height:64px;flex-basis:64px;border-radius:18px}.hero-art svg{width:39px;height:39px}.hero p{font-size:13px}.card{padding:18px;border-radius:19px}.tabs button{font-size:13px;padding:10px 7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

main{max-width:1050px}
#login{max-width:620px;margin:0 auto}
#login h2{margin:0 0 6px}
.intro{color:var(--muted);font-size:14px;margin:0 0 16px}
#form{border:0;border-radius:0;box-shadow:none;background:transparent;padding:0;margin:0}
#form input{margin:7px 0 16px;padding:12px}
#form button{width:100%;margin:8px 0 0}

#notice:not(:empty){background:#e9f7f5;border-color:#cde5e1}
</style><header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 4v24M4 16h24" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M2 17h7l3-6 5 11 3-6h10" stroke="#baf8eb" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg></span><span>بلسم | BALSAM<span class="brand-sub">الرعاية المنزلية</span></span></div><a class="top-link" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/></svg>اللوحة الرئيسية</a><a class="top-link" href="visit-services.html">الخدمات والدعم</a></div></header><main><div class="hero"><div class="hero-content"><span class="hero-tag">خدمات الرعاية المنزلية</span><h1>بوابة مقدم الخدمة المنزلية</h1><p>إدارة طلبات المختبرات والتمريض ومتابعة الزيارات.</p></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 24 5l19 16M9 18v25h30V18M24 23v13M17.5 29.5h13"/></svg></div></div><p id="notice" role="status"></p><section id="login" class="card"><h2>تسجيل الدخول</h2><p class="intro">ادخل إلى حسابك لمتابعة الطلبات والخدمات.</p><form id="form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button>تسجيل الدخول</button></form></section><section id="dashboard" hidden><h2 id="name"></h2><button id="refresh">تحديث الطلبات</button> <button id="logout" class="secondary">تسجيل الخروج</button><div id="requests"></div></section></main><style>
.request-contact{margin:12px 0;padding:14px 16px;border:1px solid #d9e9eb;border-radius:14px;background:#f7fbfb;line-height:1.8}
.request-contact strong{color:#123b55}
.request-contact p{margin:4px 0}
.request-contact a{color:#087f83;font-weight:700;text-decoration:none}
.arrival-time-label{display:block;font-weight:700;margin:10px 0 5px}
</style>
<script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");const el=id=>document.getElementById(id);const say=t=>el('notice').textContent=t;let provider;
const labels={pending:'جديد',quoted:'بانتظار قبول المراجع',confirmed:'مؤكد',en_route:'في الطريق',arrived:'وصل',completed:'مكتمل',results_ready:'النتائج جاهزة',cancelled:'ملغي'};
async function action(id,status,price=null,time=null){const {error}=await db.rpc('home_service_progress',{p_request:id,p_status:status,p_price:price,p_time:time});say(error?error.message:'تم تحديث الطلب');await load()}
async function documents(container,id,folder,upload,publish=false){const bucket=db.storage.from('home-service-documents');const prefix=id+'/'+folder;const {data,error}=await bucket.list(prefix);if(!error)for(const file of data||[]){if(!file.id)continue;const b=document.createElement('button');b.textContent=folder==='result'?'عرض نتيجة التحليل':'عرض الوصفة';b.onclick=async()=>{const {data,error}=await bucket.download(prefix+'/'+file.name);if(error){say(error.message);return}const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};container.append(b)}if(upload){const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png';input.setAttribute('aria-label',folder==='result'?'ملف نتيجة التحليل':'صورة الوصفة');const b=document.createElement('button');b.textContent=folder==='result'?'رفع النتيجة':'رفع الوصفة';b.onclick=async()=>{const f=input.files[0];if(!f||f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type)){say('اختر ملف PDF أو صورة لا تتجاوز 10 ميغابايت');return}b.disabled=true;try{const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png'}[f.type];const {error}=await bucket.upload(prefix+'/'+crypto.randomUUID()+'.'+ext,f,{contentType:f.type});if(error)throw error;say('تم رفع الملف');await load()}catch(e){say(e.message)}finally{b.disabled=false}};container.append(input,b)}if(publish){const b=document.createElement('button');b.textContent='إتاحة النتائج للمراجع';b.onclick=async()=>{const {error}=await db.rpc('home_service_publish_results',{p_request:id});say(error?error.message:'تم إتاحة النتائج');await load()};container.append(b)}}
async function load(){
 if(!provider)return;
 const {data:requests,error}=await db.rpc('home_service_provider_requests');
 if(error){say(error.message);return}
 el('requests').replaceChildren();
 for(const r of requests||[]){
  const card=document.createElement('article');
  const summary=document.createElement('p');
  summary.textContent=r.description+' — '+(labels[r.status]||r.status);
  card.append(summary);

  const contact=document.createElement('div');
  contact.className='request-contact';
  const patient=document.createElement('p');
  const patientLabel=document.createElement('strong');
  patientLabel.textContent='اسم المراجع: ';
  patient.append(patientLabel,document.createTextNode(r.patient_name||'غير مسجل'));
  contact.append(patient);

  const phone=document.createElement('p');
  const phoneLabel=document.createElement('strong');
  phoneLabel.textContent='رقم المراجع: ';
  phone.append(phoneLabel);
  const phoneNumber=String(r.patient_phone||'').trim();
  if(phoneNumber){
   const link=document.createElement('a');
   link.href='tel:'+phoneNumber.replace(/[^0-9+]/g,'');
   link.textContent=phoneNumber;
   phone.append(link);
  }else{
   phone.append(document.createTextNode('لم يُسجّل رقم تواصل'));
  }
  contact.append(phone);

  const visit=document.createElement('p');
  const visitLabel=document.createElement('strong');
  visitLabel.textContent='موقع الزيارة: ';
  visit.append(visitLabel);
  if(r.visit_address){
   visit.append(document.createTextNode(r.visit_address));
  }else if(r.latitude!==null&&r.longitude!==null){
   visit.append(document.createTextNode('الموقع محدد على الخريطة'));
  }else{
   visit.append(document.createTextNode('لم يُسجّل عنوان نصي'));
  }
  contact.append(visit);

  if(r.latitude!==null&&r.longitude!==null){
   const map=document.createElement('a');
   map.textContent='فتح موقع الزيارة على الخريطة';
   map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.latitude+','+r.longitude);
   map.target='_blank';
   map.rel='noopener noreferrer';
   contact.append(map);
  }else if(r.visit_address){
   const map=document.createElement('a');
   map.textContent='البحث عن العنوان على الخريطة';
   map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.visit_address);
   map.target='_blank';
   map.rel='noopener noreferrer';
   contact.append(map);
  }
  card.append(contact);

  if(r.quoted_price!==null){
   const offer=document.createElement('p');
   const time=r.arrival_time?String(r.arrival_time).slice(0,5):'';
   offer.textContent=Number(r.quoted_price).toLocaleString('ar-IQ')+' د.ع'+(time?' — وقت الوصول: '+time:'');
   card.append(offer);
  }

  if(r.status==='pending'){
   const form=document.createElement('form');
   const price=document.createElement('input');
   price.type='number';price.min='0';price.step='1';price.required=true;
   price.setAttribute('aria-label','السعر بالدينار');price.placeholder='السعر بالدينار';

   const time=document.createElement('input');
   time.type='time';time.required=true;
   time.setAttribute('aria-label','وقت الوصول');

   const label=document.createElement('label');
   label.className='arrival-time-label';
   label.textContent='وقت الوصول';
   form.append(price,label,time);

   const send=document.createElement('button');
   send.textContent='إرسال العرض';
   form.append(send);
   form.onsubmit=async event=>{
    event.preventDefault();
    send.disabled=true;
    try{await action(r.id,'quoted',Number(price.value),time.value)}
    finally{send.disabled=false}
   };
   card.append(form);
  }

  const next={confirmed:['en_route','الانطلاق'],en_route:['arrived','تم الوصول'],arrived:['completed','إكمال الزيارة']}[r.status];
  if(next){
   const button=document.createElement('button');
   button.textContent=next[1];
   button.onclick=async()=>{button.disabled=true;try{await action(r.id,next[0])}finally{button.disabled=false}};
   card.append(button);
  }

  await documents(card,r.id,'prescription',false);
  if(provider.kind==='laboratory'&&['completed','results_ready'].includes(r.status))
   await documents(card,r.id,'result',r.status==='completed',r.status==='completed');

  el('requests').append(card);
 }
}async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data,error}=await db.from('home_service_providers').select('id,kind,display_name,approved,subscription_expires_at').eq('account_id',session.user.id).maybeSingle();if(error||!data?.approved){say('الحساب غير معتمد كمقدم خدمة');return}provider=data;el('login').hidden=true;el('dashboard').hidden=false;el('name').textContent=data.display_name;if(!data.subscription_expires_at||new Date(data.subscription_expires_at)<=new Date())say('الاشتراك منتهٍ؛ يمكنك متابعة الطلبات السابقة وفق الصلاحيات');await load()}
el('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error)say('تعذر تسجيل الدخول');else await boot()};el('refresh').onclick=load;el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};boot();
</script></html>
