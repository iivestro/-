<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATIENT | إدارة الخدمات المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:900px;margin:auto;padding:24px}section,form{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}input,button,select{font:inherit;padding:12px;border:1px solid #bcdce9;border-radius:10px;min-height:44px;box-sizing:border-box}input,select{display:block;width:100%;margin:8px 0}button{background:#087fae;color:white}a{color:#087fae}</style><style> :root{color-scheme:light;--brand:#036b91;--ink:#173b52;--line:#d6e8ef}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at top right,#dff5ff,transparent 55%),#f4f9fc;color:var(--ink);line-height:1.75}main{max-width:980px;padding:clamp(16px,4vw,36px);margin:auto}main>h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.7px;color:#075575;margin:24px 0 4px}main>a:first-child{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:bold}main>p{color:#476779}section,form{border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 8px 30px #164e6310;background:#fff}section section,section form{background:#f8fcfe;box-shadow:none;border-radius:16px}h2{font-size:21px;color:#075575;margin-top:0}h3{color:#075575}label{font-weight:600;color:#294b60}input,select,textarea{background:#f7fbfd;border:1px solid #b7d5e2;border-radius:12px;color:#173b52;max-width:100%;min-height:48px}input:focus,select:focus,textarea:focus{outline:3px solid #bae6fd;border-color:#0284c7}button{border:0;border-radius:12px;background:linear-gradient(135deg,#036b91,#087fae);color:white;font-weight:bold;min-height:46px;padding:12px 18px;margin:4px 0 4px 6px;box-shadow:0 4px 12px #036b9120;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}#notice:not(:empty){background:#e8f5fb;border:1px solid #c1e4f4;border-radius:12px;padding:12px 16px} [hidden]{display:none!important}@media(max-width:520px){main{padding:16px}section,form{padding:16px}button{max-width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><main><a href="admin.html">العودة إلى الإدارة</a><h1>إدارة الرعاية المنزلية</h1><p id="notice" role="status"></p><div id="panel" hidden><section><h2>أسعار الاشتراكات</h2><div id="prices"></div></section><section><h2>مقدمو الخدمات</h2><form id="add"><label>معرف حساب المستخدم UUID<input id="account" required></label><label>الاسم<input id="name" required></label><label>المحافظة<input id="city" required></label><label>نوع الخدمة<select id="kind"><option value="laboratory">مختبر</option><option value="male">ممرض</option><option value="female">ممرضة</option></select></label><button>إضافة حساب للمراجعة</button></form><div id="providers"></div></section></div></main><script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");const el=id=>document.getElementById(id);const say=t=>el('notice').textContent=t;const names={laboratory:'المختبرات',nurse:'التمريض',representative:'المندوبون',doctor:'الأطباء',medical_center:'المراكز'};
async function load(){const {data:prices,error}=await db.from('service_subscription_prices').select('*');if(error){say(error.message);return}el('prices').replaceChildren();for(const p of prices){const f=document.createElement('form'),l=document.createElement('label'),i=document.createElement('input'),b=document.createElement('button');l.textContent=(names[p.service]||p.service)+' — السعر بالدينار';i.type='number';i.min='0';i.step='1';i.required=true;i.value=p.monthly_fee;l.append(i);b.textContent='حفظ السعر';f.append(l,b);f.onsubmit=async e=>{e.preventDefault();const {error}=await db.from('service_subscription_prices').update({monthly_fee:Number(i.value)}).eq('service',p.service);say(error?error.message:'تم حفظ السعر')};el('prices').append(f)}const {data:providers,error:pe}=await db.from('home_service_providers').select('*').order('display_name');if(pe){say(pe.message);return}el('providers').replaceChildren();for(const p of providers){const f=document.createElement('form'),h=document.createElement('h3'),l=document.createElement('label'),i=document.createElement('input'),a=document.createElement('label'),c=document.createElement('input'),b=document.createElement('button');h.textContent=p.display_name+' — '+p.governorate;l.textContent='انتهاء الاشتراك';i.type='date';i.value=p.subscription_expires_at?.slice(0,10)||'';l.append(i);c.type='checkbox';c.checked=p.approved;c.style.width='auto';a.append(c,document.createTextNode(' معتمد بعد التحقق من الترخيص'));b.textContent='حفظ';f.append(h,l,a,b);f.onsubmit=async e=>{e.preventDefault();const {error}=await db.from('home_service_providers').update({approved:c.checked,subscription_expires_at:i.value?new Date(i.value+'T23:59:59+03:00').toISOString():null}).eq('id',p.id);say(error?error.message:'تم حفظ الحساب')};const renewal=document.createElement('div');const info=document.createElement('p');info.textContent='الاشتراك الحالي: '+(p.subscription_fee==null?'غير محدد':p.subscription_fee+' د.ع')+(p.subscription_is_trial?' — تجريبي':'');const special=document.createElement('input');special.type='number';special.min='0';special.step='1';special.placeholder='سعر خاص اختياري بالدينار';special.setAttribute('aria-label','سعر التجديد الخاص');const renew=document.createElement('button');renew.type='button';renew.textContent='تجديد الاشتراك';const trial=document.createElement('button');trial.type='button';trial.textContent='منح شهر مجاني';async function doRenew(isTrial){if(!confirm(isTrial?'منح اشتراك مجاني؟':'تأكيد تجديد الاشتراك؟'))return;if(special.value!==''&&!special.checkValidity()){say('السعر غير صالح');return}renew.disabled=trial.disabled=true;try{const {error}=await db.rpc('home_service_renew',{p_provider:p.id,p_special_fee:isTrial||special.value===''?null:Number(special.value),p_trial:isTrial});if(error)throw error;say('تم تجديد الاشتراك');await load()}catch(e){say(e.message)}finally{renew.disabled=trial.disabled=false}}renew.onclick=()=>doRenew(false);trial.onclick=()=>doRenew(true);renewal.append(info,special,renew,trial);f.append(renewal);el('providers').append(f)}}
el('add').onsubmit=async e=>{e.preventDefault();const k=el('kind').value;const {error}=await db.from('home_service_providers').insert({account_id:el('account').value.trim(),display_name:el('name').value.trim(),governorate:el('city').value.trim(),kind:k==='laboratory'?k:'nurse',gender:k==='laboratory'?null:k,approved:false});say(error?error.message:'تمت الإضافة للمراجعة');if(!error){e.target.reset();await load()}};
(async()=>{const {data,error}=await db.rpc('is_admin');if(error||data!==true){say('سجل الدخول من لوحة المدير أولاً');return}el('panel').hidden=false;await load()})();
</script></html>
