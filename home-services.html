<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PATIENT | الخدمات المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}button,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcdce9;box-sizing:border-box;min-height:44px}select,textarea{width:100%;margin:8px 0}button{background:#087fae;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin-top:12px}a{color:#087fae}</style><main><a href="patients.html">العودة إلى بوابة المراجع</a><h1>الرعاية الصحية المنزلية</h1><p>اطلب زيارة تمريضية أو سحب عينات من مختبر معتمد. ليست خدمة طوارئ.</p><p id="notice" role="status"></p><section id="booking" hidden><h2>طلب زيارة</h2><label for="kind">الخدمة</label><select id="kind"><option value="laboratory">مختبر</option><option value="male">ممرض</option><option value="female">ممرضة</option></select><label for="provider">مقدم الخدمة</label><select id="provider"></select><label for="description">الخدمة أو التحاليل المطلوبة</label><textarea id="description" maxlength="4000" rows="4"></textarea><button id="send">إرسال الطلب</button></section><section id="history" hidden><h2>طلباتي</h2><button id="refresh">تحديث</button><div id="requests"></div></section></main><script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");
const el=id=>document.getElementById(id);let providers=[];
const say=t=>el('notice').textContent=t;
const labels={pending:'بانتظار الرد',quoted:'عرض سعر',confirmed:'مؤكد',en_route:'في الطريق',arrived:'وصل',completed:'مكتمل',results_ready:'النتائج جاهزة',cancelled:'ملغي'};
function filter(){let k=el('kind').value;el('provider').replaceChildren();for(const p of providers.filter(p=>k==='laboratory'?p.kind===k:p.kind==='nurse'&&p.gender===k)){let o=document.createElement('option');o.value=p.id;o.textContent=p.display_name+' — '+p.governorate;el('provider').append(o)}el('send').disabled=!el('provider').value}
async function documents(container,id,folder,upload,publish=false){const bucket=db.storage.from('home-service-documents');const prefix=id+'/'+folder;const {data,error}=await bucket.list(prefix);if(!error)for(const file of data||[]){if(!file.id)continue;const b=document.createElement('button');b.textContent=folder==='result'?'عرض نتيجة التحليل':'عرض الوصفة';b.onclick=async()=>{const {data,error}=await bucket.download(prefix+'/'+file.name);if(error){say(error.message);return}const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};container.append(b)}if(upload){const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png';input.setAttribute('aria-label',folder==='result'?'ملف نتيجة التحليل':'صورة الوصفة');const b=document.createElement('button');b.textContent=folder==='result'?'رفع النتيجة':'رفع الوصفة';b.onclick=async()=>{const f=input.files[0];if(!f||f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type)){say('اختر ملف PDF أو صورة لا تتجاوز 10 ميغابايت');return}b.disabled=true;try{const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png'}[f.type];const {error}=await bucket.upload(prefix+'/'+crypto.randomUUID()+'.'+ext,f,{contentType:f.type});if(error)throw error;say('تم رفع الملف');await load()}catch(e){say(e.message)}finally{b.disabled=false}};container.append(input,b)}if(publish){const b=document.createElement('button');b.textContent='إتاحة النتائج للمراجع';b.onclick=async()=>{const {error}=await db.rpc('home_service_publish_results',{p_request:id});say(error?error.message:'تم إتاحة النتائج');await load()};container.append(b)}}
async function load(){const {data,error}=await db.from('home_service_requests').select('id,description,status,quoted_price,scheduled_at').order('created_at',{ascending:false});if(error){say(error.message);return}el('requests').replaceChildren();for(const r of data){let s=document.createElement('section');let p=document.createElement('p');p.textContent=r.description+' — '+(labels[r.status]||r.status);s.append(p);if(r.quoted_price!==null){let q=document.createElement('p');q.textContent=r.quoted_price+' د.ع — '+new Date(r.scheduled_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'});s.append(q)}if(r.status==='quoted'){let b=document.createElement('button');b.textContent='قبول العرض ومشاركة موقعي';b.onclick=()=>{if(!confirm('هل توافق على إرسال موقعك لمقدم الخدمة لتنفيذ الزيارة؟'))return;if(!navigator.geolocation){say('الموقع غير متاح');return}b.disabled=true;navigator.geolocation.getCurrentPosition(async pos=>{const {error}=await db.rpc('home_service_accept',{p_request:r.id,p_lat:pos.coords.latitude,p_lon:pos.coords.longitude});say(error?error.message:'تم تأكيد الحجز');b.disabled=false;await load()},()=>{say('تعذر تحديد الموقع');b.disabled=false},{timeout:15000,enableHighAccuracy:true})};s.append(b)}await documents(s,r.id,'prescription',r.status==='pending');if(r.status==='results_ready')await documents(s,r.id,'result',false);el('requests').append(s)}}
el('kind').onchange=filter;el('refresh').onclick=load;el('send').onclick=async()=>{let d=el('description').value.trim();if(!d||!el('provider').value){say('اختر مقدم الخدمة واكتب الطلب');return}el('send').disabled=true;try{const {error}=await db.rpc('home_service_book',{p_provider:el('provider').value,p_description:d});if(error)throw error;el('description').value='';say('تم إرسال الطلب');await load()}catch(e){say(e.message)}finally{filter()}};
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){say('سجل الدخول من بوابة المراجع أولاً');return}const {data:p,error:e}=await db.from('profiles').select('role,approval_status').eq('id',session.user.id).maybeSingle();if(e||p?.role!=='patient'||p.approval_status!=='approved'){say('هذه الخدمة للمراجعين المعتمدين');return}const {data,error}=await db.rpc('home_service_directory');if(error){say(error.message);return}providers=data||[];const k=new URLSearchParams(location.search).get('kind');if(['male','female','laboratory'].includes(k))el('kind').value=k;el('booking').hidden=false;el('history').hidden=false;filter();if(!providers.length)say('لا يوجد مقدمو خدمات متاحون حالياً');await load()})();
</script></html>
