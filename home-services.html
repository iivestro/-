<!doctype html><html lang="ar" dir="rtl">
<link rel="stylesheet" href="balsam-demo/balsam-theme.css?v=20261126-balsam"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALSAM | الخدمات المنزلية</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script><style>body{font:16px Tahoma,Arial;background:#f4faff;color:#173b52;margin:0}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #cceaf6;border-radius:18px;padding:20px;margin:16px 0}button,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #bcdce9;box-sizing:border-box;min-height:44px}select,textarea{width:100%;margin:8px 0}button{background:#087fae;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin-top:12px}a{color:#087fae}</style><style> :root{color-scheme:light;--brand:#036b91;--ink:#173b52;--line:#d6e8ef}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at top right,#dff5ff,transparent 55%),#f4f9fc;color:var(--ink);line-height:1.75}main{max-width:980px;padding:clamp(16px,4vw,36px);margin:auto}main>h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.7px;color:#075575;margin:24px 0 4px}main>a:first-child{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-decoration:none;font-weight:bold}main>p{color:#476779}section,form{border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 8px 30px #164e6310;background:#fff}section section,section form{background:#f8fcfe;box-shadow:none;border-radius:16px}h2{font-size:21px;color:#075575;margin-top:0}h3{color:#075575}label{font-weight:600;color:#294b60}input,select,textarea{background:#f7fbfd;border:1px solid #b7d5e2;border-radius:12px;color:#173b52;max-width:100%;min-height:48px}input:focus,select:focus,textarea:focus{outline:3px solid #bae6fd;border-color:#0284c7}button{border:0;border-radius:12px;background:linear-gradient(135deg,#036b91,#087fae);color:white;font-weight:bold;min-height:46px;padding:12px 18px;margin:4px 0 4px 6px;box-shadow:0 4px 12px #036b9120;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}#notice:not(:empty){background:#e8f5fb;border:1px solid #c1e4f4;border-radius:12px;padding:12px 16px} [hidden]{display:none!important}@media(max-width:520px){main{padding:16px}section,form{padding:16px}button{max-width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}.visitbox{background:#f5fbfd;border:1px solid #cde5ef;border-radius:16px;padding:16px;margin:16px 0}.visitbox input{width:100%;padding:12px;font:inherit}.visitbox h3{margin:0 0 8px}.visitbox p{font-size:14px;color:#476779}#locate{background:#18794e;width:100%}#send{width:100%}</style><main><a href="patients.html">العودة إلى بوابة المراجع</a><h1 id="portalTitle">الرعاية الصحية المنزلية</h1><p id="portalIntro">اطلب زيارة تمريضية أو سحب عينات من مختبر معتمد. ليست خدمة طوارئ.</p><p id="notice" role="status"></p><section id="booking" hidden><h2>طلب زيارة</h2><label for="kind">الخدمة</label><select id="kind"><option value="laboratory">مختبر</option><option value="male">ممرض</option><option value="female">ممرضة</option></select><label for="provider">مقدم الخدمة</label><select id="provider"></select><label for="description">الخدمة أو التحاليل المطلوبة</label><textarea id="description" maxlength="4000" rows="4"></textarea><label for="contactPhone">رقم هاتف للتواصل</label><input id="contactPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="07XXXXXXXXX" required><div id="prescriptionBox" class="visitbox"><label for="prescription">إرفاق صورة الوصفة الطبية (اختياري)</label><input id="prescription" type="file" accept="image/jpeg,image/png,application/pdf"></div><div class="visitbox"><h3>📍 عنوان الزيارة المنزلية</h3><button id="locate" type="button">تحديد موقعي الحالي GPS</button><p id="locationStatus" role="status">لم يتم تحديد الموقع بعد</p><label for="address">عنوان المنزل أو أقرب نقطة دالة</label><input id="address" maxlength="500" placeholder="المحافظة، الحي، أقرب نقطة دالة"><p>عند إرسال الطلب، سيظهر اسمك ورقم هاتفك وموقع الزيارة لمقدم الخدمة الذي اخترته ليتمكن من ترتيب الوصول.</p></div><button id="send">إرسال الطلب</button></section><section id="history" hidden><h2>طلباتي</h2><button id="refresh">تحديث</button><div id="requests"></div></section></main><script>
const db=supabase.createClient("https://oejkeqlqkwdfropylxsv.supabase.co","sb_publishable_Ue8nsJFsLpDLFUgSTB24cw_rckeqWag");
const el=id=>document.getElementById(id);let providers=[];const mode=new URLSearchParams(location.search).get('kind');const lab=mode==='laboratory';const nursing=['male','female'].includes(mode);if(lab||nursing){el('portalTitle').textContent=lab?'بوابة المختبرات الطبية':'بوابة التمريض';el('portalIntro').textContent=lab?'اختر مختبراً معتمداً واطلب سحب العينات من منزلك واستلم النتائج داخل حسابك.':'اختر ممرضاً أو ممرضة معتمدة وحدد الرعاية المطلوبة في المنزل. ليست خدمة طوارئ.';for(const o of [...el('kind').options])if(lab?o.value!=='laboratory':o.value==='laboratory')o.remove();el('kind').value=lab?'laboratory':mode;if(lab){el('kind').hidden=true;document.querySelector('label[for="kind"]').hidden=true;}document.querySelector('label[for="description"]').textContent=lab?'التحاليل المطلوبة أو وصف الوصفة الطبية':'الخدمة التمريضية المطلوبة';}
let coords=null;el('locate').onclick=()=>{if(!navigator.geolocation){el('locationStatus').textContent='الموقع غير متاح؛ اكتب العنوان يدوياً';return}el('locate').disabled=true;el('locationStatus').textContent='جارٍ تحديد الموقع…';navigator.geolocation.getCurrentPosition(p=>{coords=p.coords;el('locationStatus').textContent='تم تحديد موقعك بنجاح';el('locate').disabled=false},()=>{el('locationStatus').textContent='تعذر تحديد الموقع؛ اكتب العنوان يدوياً';el('locate').disabled=false},{timeout:20000,enableHighAccuracy:true})};const say=t=>el('notice').textContent=t;
function normalizeIraqiPhone(value){let digits=String(value||'').replace(/\D/g,'');if(digits.length===13&&digits.startsWith('9647'))digits='0'+digits.slice(3);return digits}
const labels={pending:'بانتظار الرد',quoted:'عرض سعر',confirmed:'مؤكد',en_route:'في الطريق',arrived:'وصل',completed:'مكتمل',results_ready:'النتائج جاهزة',cancelled:'ملغي'};
function filter(){let k=el('kind').value;el('prescriptionBox').hidden=k!=='laboratory';el('provider').replaceChildren();for(const p of providers.filter(p=>k==='laboratory'?p.kind===k:p.kind==='nurse'&&p.gender===k)){let o=document.createElement('option');o.value=p.id;o.textContent=p.display_name+' — '+p.governorate;el('provider').append(o)}el('send').disabled=!el('provider').value}
async function documents(container,id,folder,upload,publish=false){const bucket=db.storage.from('home-service-documents');const prefix=id+'/'+folder;const {data,error}=await bucket.list(prefix);if(!error)for(const file of data||[]){if(!file.id)continue;const b=document.createElement('button');b.textContent=folder==='result'?'عرض نتيجة التحليل':'عرض الوصفة';b.onclick=async()=>{const {data,error}=await bucket.download(prefix+'/'+file.name);if(error){say(error.message);return}const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};container.append(b)}if(upload){const input=document.createElement('input');input.type='file';input.accept='application/pdf,image/jpeg,image/png';input.setAttribute('aria-label',folder==='result'?'ملف نتيجة التحليل':'صورة الوصفة');const b=document.createElement('button');b.textContent=folder==='result'?'رفع النتيجة':'رفع الوصفة';b.onclick=async()=>{const f=input.files[0];if(!f||f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type)){say('اختر ملف PDF أو صورة لا تتجاوز 10 ميغابايت');return}b.disabled=true;try{const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png'}[f.type];const {error}=await bucket.upload(prefix+'/'+crypto.randomUUID()+'.'+ext,f,{contentType:f.type});if(error)throw error;say('تم رفع الملف');await load()}catch(e){say(e.message)}finally{b.disabled=false}};container.append(input,b)}if(publish){const b=document.createElement('button');b.textContent='إتاحة النتائج للمراجع';b.onclick=async()=>{const {error}=await db.rpc('home_service_publish_results',{p_request:id});say(error?error.message:'تم إتاحة النتائج');await load()};container.append(b)}}
function formatArrival(value,fallback){if(value)return String(value).slice(0,5);if(fallback)return new Date(fallback).toLocaleTimeString('ar-IQ',{timeZone:'Asia/Baghdad',hour:'2-digit',minute:'2-digit'});return ''}
function baghdadDateOffset(offset=0){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});const d=new Date(Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day)+offset));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function serviceDay(value){return value===baghdadDateOffset(0)?'اليوم':value===baghdadDateOffset(1)?'غداً':''}
async async function load(){
 const {data,error}=await db.from('home_service_requests').select('id,description,status,quoted_price,arrival_date,arrival_time,scheduled_at').order('created_at',{ascending:false});
 if(error){say(error.message);return}
 const {data:queueData}=await db.rpc('home_service_patient_queue_positions');
 const queues=new Map((queueData||[]).map(q=>[q.request_id,q]));
 el('requests').replaceChildren();
 for(const r of data||[]){
  const card=document.createElement('section');
  const summary=document.createElement('p');
  summary.textContent=r.description+' — '+(labels[r.status]||r.status);card.append(summary);
  if(r.quoted_price!==null){
   const q=document.createElement('p');
   const time=formatArrival(r.arrival_time,r.scheduled_at);
   const day=serviceDay(r.arrival_date);
   q.textContent=Number(r.quoted_price).toLocaleString('ar-IQ')+' د.ع'+(time?' — الوصول '+day+' الساعة '+time:'');
   card.append(q);
  }
  const queue=queues.get(r.id);
  if(queue&&['confirmed','en_route','arrived'].includes(r.status)){
   const q=document.createElement('p');q.textContent='دورك رقم '+queue.queue_position+' — قبلك '+queue.patients_ahead+' مراجع.';card.append(q);
  }
  if(r.status==='quoted'){
   const b=document.createElement('button');b.textContent='قبول العرض';b.onclick=async()=>{
    if(!confirm('هل توافق على السعر ووقت الوصول؟'))return;
    const saved=await db.from('home_service_locations').select('request_id').eq('request_id',r.id).maybeSingle();
    if(saved.error){say(saved.error.message);return}
    if(saved.data){b.disabled=true;const {error}=await db.rpc('home_service_accept_saved',{p_request:r.id});say(error?error.message:'تم تأكيد الحجز');b.disabled=false;await load();return}
    if(!navigator.geolocation){say('الموقع غير متاح');return}
    b.disabled=true;navigator.geolocation.getCurrentPosition(async pos=>{
     const {error}=await db.rpc('home_service_accept',{p_request:r.id,p_lat:pos.coords.latitude,p_lon:pos.coords.longitude});
     say(error?error.message:'تم تأكيد الحجز');b.disabled=false;await load()
    },()=>{say('تعذر تحديد الموقع');b.disabled=false},{timeout:15000,enableHighAccuracy:true})
   };card.append(b)
  }
  await documents(card,r.id,'prescription',r.status==='pending');
  if(r.status==='results_ready')await documents(card,r.id,'result',false);
  el('requests').append(card)
 }
}
el('kind').onchange=filter;el('refresh').onclick=load;el('send').onclick=async()=>{let d=el('description').value.trim(),address=el('address').value.trim(),contactPhone=normalizeIraqiPhone(el('contactPhone').value),f=el('kind').value==='laboratory'?el('prescription').files[0]:null;if(!el('provider').value||(!d&&!f)){say('اختر مقدم الخدمة واكتب الطلب أو أرفق الوصفة');return}if(!/^07[0-9]{9}$/.test(contactPhone)){say('أدخل رقم هاتف عراقي صحيحاً يبدأ بـ 07 ويتكون من 11 رقماً');return}if(!coords&&!address){say('حدد موقعك أو اكتب عنوان المنزل');return}if(f&&(f.size>10485760||!['application/pdf','image/jpeg','image/png'].includes(f.type))){say('اختر صورة أو PDF لا يتجاوز 10 ميغابايت');return}el('send').disabled=true;try{const {data:id,error}=await db.rpc('home_service_book_location',{p_provider:el('provider').value,p_description:d||'التحاليل حسب الوصفة المرفقة',p_lat:coords?.latitude??null,p_lon:coords?.longitude??null,p_address:address,p_contact_phone:contactPhone});if(error)throw error;el('description').value='';el('address').value='';el('prescription').value='';coords=null;el('locationStatus').textContent='لم يتم تحديد الموقع بعد';if(f){const ext={'application/pdf':'pdf','image/jpeg':'jpg','image/png':'png'}[f.type];const upload=await db.storage.from('home-service-documents').upload(id+'/prescription/'+crypto.randomUUID()+'.'+ext,f,{contentType:f.type});if(upload.error){say('تم إرسال الطلب لكن تعذر رفع الوصفة؛ أعد رفعها من طلباتي');await load();return}}say('تم إرسال الطلب؛ سيظهر اسمك ورقم التواصل وموقعك لمقدم الخدمة الذي اخترته.');await load()}catch(e){say(e.message)}finally{filter()}};
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){say('سجل الدخول من بوابة المراجع أولاً');return}const {data:p,error:e}=await db.from('profiles').select('role,approval_status,phone').eq('id',session.user.id).maybeSingle();if(p?.phone&&!el('contactPhone').value)el('contactPhone').value=p.phone;if(e||p?.role!=='patient'||p.approval_status!=='approved'){say('هذه الخدمة للمراجعين المعتمدين');return}const {data,error}=await db.rpc('home_service_directory');if(error){say(error.message);return}providers=data||[];const k=new URLSearchParams(location.search).get('kind');if(['male','female','laboratory'].includes(k))el('kind').value=k;el('booking').hidden=false;el('history').hidden=false;filter();if(!el('provider').value)say('لا يوجد مقدمو خدمات متاحون في هذه الفئة حالياً');await load()})();
</script></html>
