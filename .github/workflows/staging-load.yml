name: Staging load smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-load
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Check staging configuration
        env:
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: test -n "$STAGING_ANON_KEY"
      - name: Run bounded smoke test
        env:
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: k6 run --summary-export=summary.json tests/load/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-load-summary
          path: summary.json
