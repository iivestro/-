const labels={"id":"المعرف","subject":"العنوان","body":"التفاصيل","status":"الحالة","reply":"رد الإدارة","created_at":"تاريخ الإنشاء","updated_at":"آخر تحديث","category":"النوع","title":"العنوان","note":"ملاحظة","record_date":"تاريخ السجل","kind":"النوع","booking_id":"معرف الحجز","provider_id":"معرف مقدم الخدمة","service_date":"اليوم","queue_number":"رقم الدور","state":"الحالة","ahead":"عدد المراجعين قبلك","distance_km":"المسافة الجوية (كم)","latitude":"خط العرض","longitude":"خط الطول","recorded_revenue_iqd":"الإيرادات المسجلة بالدينار هذا الشهر","payment_count":"عدد الدفعات","support_open":"التذاكر المفتوحة","subscriptions_expiring":"الاشتراكات المنتهية خلال 7 أيام","errors_24h":"الأخطاء المسجلة آخر 24 ساعة","maintenance":"وضع الصيانة","message":"رسالة الصيانة","starts_at":"البداية","ends_at":"النهاية","published":"منشور","governorate":"المحافظة","district":"المنطقة","active":"فعال","permission":"الصلاحية","user_id":"معرف الموظف","saved":"تم الحفظ","updated":"تم التحديث","deleted":"تم الحذف","enforced":"مطبق فعلياً","registered":"تم التسجيل"};

const $=id=>document.getElementById(id);
const display=v=>v==null?'—':values[String(v)]??String(v);
let selected=null,role='patient',busy=false,paymentId='';
const say=t=>{$('notice').textContent=t;};
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function btn(text,fn){const b=node('button',text);b.type='button';b.onclick=fn;return b;}
async function run(action,data={}){
 if(busy)return;
 if(!FEATURES_READY){say('الخدمات الجديدة مجهزة للمعاينة؛ لم يتم تشغيلها على قاعدة المنصة الأصلية.');return;}
 busy=true;say('جارٍ التنفيذ');$('results').replaceChildren();
 try{const {data:result,error}=await db.rpc('v2_feature_action',{p_action:action,p_data:data});if(error)throw Error();render(result);say('تم تنفيذ الطلب.');}catch{say('تعذر تنفيذ الطلب أو أن الحساب غير مخول.');}finally{busy=false;}
}
function render(result){const rows=Array.isArray(result)?result:result&&typeof result==='object'?[result]:[];const box=$('results');box.replaceChildren();if(!rows.length){box.append(node('p','لا توجد نتائج.'));return;}rows.forEach(r=>{const item=node('div');item.className='item';Object.entries(r).filter(([k])=>k!=='id').forEach(([k,v])=>item.append(node('p',(labels[k]??k)+': '+display(v))));if(selected?.action==='queue_provider'&&['waiting','called'].includes(r.state)){item.append(btn(r.state==='waiting'?'نداء المراجع':'إنهاء الدور',()=>run('queue_update',{id:r.id,state:r.state==='waiting'?'called':'completed'})));}if(selected?.action==='health_list')item.append(btn('حذف السجل',()=>{if(confirm('حذف السجل؟'))run('health_delete',{id:r.id});}));if(selected?.action==='support_list'&&role==='admin'&&r.status==='open'){const reply=node('input');reply.setAttribute('aria-label','رد الإدارة');reply.maxLength=2000;item.append(reply,btn('إرسال الرد',()=>{if(reply.value.trim())run('support_reply',{id:r.id,reply:reply.value});}));}if(selected?.action==='announcement_admin_list')item.append(btn(r.published?'إلغاء النشر':'نشر',()=>run('announcement_publish',{id:r.id,published:!r.published})));box.append(item);});}
function choose(f){selected=f;paymentId='';$('panel').hidden=false;$('title').textContent=f.title;$('fields').replaceChildren();$('results').replaceChildren();say('');if(!f.fields){$('fields').append(btn('تحديث',()=>run(f.action)));run(f.action);return;}for(const [key,label,type] of f.fields){const l=node('label',label);l.htmlFor='f-'+key;let input;if(type?.includes('|')){input=node('select');input.append(new Option('اختر',''));type.split('|').forEach(v=>input.append(new Option(display(v),v)));}else{input=node('input');input.type=['number','date','datetime-local'].includes(type)?type:'text';input.maxLength=2000;if(type==='number')input.step='any';}input.id='f-'+key;input.name=key;input.required=type!=='optional';$('fields').append(l,input);}if(f.action==='nearby')$('fields').append(btn('استخدام موقعي بعد إذني',()=>{navigator.geolocation?.getCurrentPosition(p=>{$('f-latitude').value=String(p.coords.latitude);$('f-longitude').value=String(p.coords.longitude);say('تم تحديد الموقع؛ اضغط البحث.');},()=>say('تعذر الحصول على الموقع.'));}));const b=node('button',f.action==='nearby'?'بحث':'تنفيذ');b.type='submit';$('fields').append(b);}
$('fields').onsubmit=e=>{e.preventDefault();if(!selected)return;const data={};const form=new FormData(e.currentTarget);for(const [key,,type] of selected.fields??[]){const v=String(form.get(key)??'');if(type==='optional'&&!v)continue;data[key]=type==='number'?Number(v):type==='datetime-local'?new Date(v).toISOString():v;}if(selected.action==='queue_checkin')data.kind=role==='doctor'?'doctor':'center';if(selected.action==='payment_record'){paymentId ||= crypto.randomUUID();data.request_id=paymentId;}run(selected.action,data);};
function menu(){selected=null;$('panel').hidden=true;$('menu').replaceChildren();features.filter(f=>f.roles.includes(role)).forEach(f=>$('menu').append(btn(f.title,()=>choose(f))));}
$('rolePreview').onchange=()=>{if(FEATURES_READY)return;role=$('rolePreview').value;menu();};
(async()=>{if(!FEATURES_READY){$('account').textContent='معاينة فقط؛ لا توجد بيانات حقيقية.';menu();return;}const {data:{user}}=await db.auth.getUser();if(!user){$('account').textContent='سجل الدخول إلى بوابتك أولاً.';return;}const {data:p}=await db.from('profiles').select('role,approval_status').eq('id',user.id).maybeSingle();if(p?.approval_status!=='approved')return;role=p.role;$('rolePreview').disabled=true;menu();})();
