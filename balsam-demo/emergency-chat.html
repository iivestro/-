
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محادثة الطوارئ | بلسم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--sky:#35b8e6;
--dark:#087fae;
--line:#d8eef6;
--pale:#eaf8ff;
}

body{
min-height:100vh;
background:#f4faff;
color:#174b60;
font-family:"Segoe UI",Tahoma,Arial,sans-serif;
padding:18px;
}

.wrap{
max-width:760px;
margin:25px auto;
background:#fff;
border:1px solid var(--line);
border-radius:22px;
overflow:hidden;
box-shadow:0 12px 40px #168db714;
}

header{
text-align:center;
padding:26px 20px;
background:linear-gradient(135deg,#e8f8ff,#fff);
border-bottom:1px solid var(--line);
}

.logo{
margin:auto auto 12px;
width:60px;
height:60px;
border-radius:18px;
background:#def5ff;
color:var(--sky);
display:grid;
place-items:center;
font-size:32px;
}

h1{
color:var(--dark);
font-size:25px;
margin-bottom:8px;
}

.sub{
color:#6b91a0;
font-size:14px;
line-height:1.9;
}

main{padding:23px}

label{
display:block;
font-weight:700;
margin-bottom:9px;
}

input,textarea{
width:100%;
border:1px solid #cfe7f0;
border-radius:12px;
padding:13px;
font:inherit;
outline:none;
}

input:focus,textarea:focus{
border-color:var(--sky);
box-shadow:0 0 0 3px #35b8e61c;
}

button{
border:0;
border-radius:12px;
background:var(--sky);
color:#fff;
padding:13px 18px;
font:inherit;
font-weight:800;
cursor:pointer;
}

button:disabled{
opacity:.55;
cursor:wait;
}

.primary{
width:100%;
margin-top:16px;
}

.notice{
display:none;
margin-top:14px;
padding:12px;
border-radius:12px;
font-size:14px;
line-height:1.8;
}

.error{
display:block;
background:#fff0f0;
color:#b42318;
}

.success{
display:block;
background:#eaf9f0;
color:#187343;
}

#chatArea{display:none}

.chat-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:14px;
flex-wrap:wrap;
}

.chat-head strong{color:var(--dark)}

#messages{
height:430px;
overflow:auto;
background:#f7fcfe;
border:1px solid var(--line);
border-radius:15px;
padding:14px;
display:flex;
flex-direction:column;
gap:11px;
}

.msg{
max-width:85%;
padding:11px 13px;
border-radius:15px;
line-height:1.8;
overflow-wrap:anywhere;
}

.msg.visitor{
align-self:flex-start;
background:#def4fc;
color:#174b60;
border-bottom-left-radius:4px;
}

.msg.doctor{
align-self:flex-end;
background:#e5f7ed;
color:#145c3b;
border-bottom-right-radius:4px;
}

.meta{
font-size:11px;
opacity:.7;
margin-bottom:4px;
}

.send{
display:flex;
gap:9px;
margin-top:12px;
}

.send textarea{
min-height:48px;
max-height:120px;
resize:vertical;
flex:1;
}

.send button{min-width:85px}

.small{
font-size:12px;
color:#7895a1;
line-height:1.8;
margin-top:12px;
}

.back{
display:block;
text-align:center;
color:var(--dark);
text-decoration:none;
margin:18px;
}

@media(max-width:560px){
body{padding:8px}
.wrap{margin:8px auto}
main{padding:15px}
#messages{height:55vh}
.send button{min-width:70px;padding:10px}
}

:root{--sky:#087f83;--dark:#12656c;--line:#dcebea;--pale:#e8f7f5;--blue:#087f83;--blue-dark:#12656c;--bg:#f4faf9;--border:#dcebea}
body{background:radial-gradient(ellipse at top right,#def3f0,transparent 45%),#f4faf9;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.attachment{flex:1 1 100%;border:1px solid #dcebea;background:#f5fbfa;border-radius:14px;padding:12px;min-width:0}
.attachment input{max-width:100%;font-size:13px}
.attachment-image{display:block;max-width:min(100%,320px);max-height:240px;object-fit:contain;border-radius:12px;margin:8px 0}
.attachment-image[hidden]{display:none!important}
.secondary-image{color:#12656c;background:#e8f7f5;min-height:44px;border:1px solid #cde5e1}
.image-note{font-size:12px;color:#506d77;line-height:1.7;margin:6px 0}
.send,.composer{flex-wrap:wrap}.send textarea,.composer textarea{min-width:0}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}button{min-height:44px}
</style>
<link rel="stylesheet" href="./balsam-theme.css?v=20261126b">
</head>

<body>

<div class="wrap">

<header>
<div class="logo"><img src="./assets/%D8%A3%D9%8A%D9%82%D9%88%D9%86%D8%A9%20%D8%A8%D9%84%D8%B3%D9%85%20%D8%A7%D9%84%D8%B7%D8%A8%D9%8A%D8%A9%20%D8%A8%D9%84%D9%85%D8%B3%D8%A9%20%D8%AD%D8%AC%D8%B2(1).png" alt="شعار بلسم"></div>
<h1>محادثة الطوارئ</h1>
<p class="sub">
تواصل مباشرة مع طبيب الطوارئ.
اكتب اسمك أولاً لبدء المحادثة.
</p>
</header>

<main>

<section id="startArea">

<form id="startForm">

<label for="visitorName">الاسم الكامل</label>

<input
id="visitorName"
type="text"
minlength="2"
maxlength="80"
autocomplete="name"
placeholder="اكتب اسمك هنا"
required
>

<button
class="primary"
id="startButton"
type="submit"
>
ابدأ المحادثة
</button>

</form>

<p class="small">
لا تحتاج إلى إنشاء حساب أو تسجيل دخول.
احتفظ بهذه الصفحة مفتوحة لمتابعة الردود.
</p>

</section>

<section id="chatArea">

<div class="chat-head">

<strong id="chatTitle">
المحادثة مع طبيب الطوارئ
</strong>

<button
id="newChatButton"
type="button"
style="background:#eaf8ff;color:#087fae"
>
محادثة جديدة
</button>

</div>

<div id="messages" aria-live="polite"></div>

<form id="sendForm" class="send">

<textarea
id="messageInput"
maxlength="2000"
rows="2"
placeholder="اكتب رسالتك..."
></textarea>
<label class="attachment" for="imageInput">إرفاق صورة للمحادثة<input id="imageInput" type="file" accept="image/jpeg,image/png"><img id="imagePreview" class="attachment-image" alt="معاينة الصورة" hidden><span class="image-note">PNG أو JPG، حتى 2 ميغابايت. تُحفظ في مساحة خاصة وتظهر لطرفي المحادثة.</span></label>

<button id="sendButton" type="submit">
إرسال
</button>

</form>

<p class="small">
سيجيب طبيب الطوارئ عند توفره.
لا تعتمد على المحادثة وحدها في الحالات التي تتطلب إسعافاً فورياً.
</p>

</section>

<div id="notice" class="notice" role="status"></div>

</main>

<a class="back" href="./index.html">
اللوحة الرئيسية
</a>

</div>

<script>

// إعدادات المشروع

const SUPABASE_URL =
"https://sfaatbfiwwbvobpvhwxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CBPPwjIcmVbGK1fr8EHyYg_DlfldbK6";

const API =
SUPABASE_URL + "/functions/v1/emergency-chat";

const $ = id => document.getElementById(id);

// بيانات المحادثة الحالية

let chatId = null;
let accessToken = null;
let pollHandle = null;
let lastRendered = "";

// تحويل الصورة إلى صيغة آمنة للرفع عبر الخادم.
async function readAttachment(file){
 if(!file)return null;
 if(!["image/jpeg","image/png"].includes(file.type))throw new Error("اختر صورة JPG أو PNG.");
 if(file.size>2*1024*1024)throw new Error("حجم الصورة يجب ألا يتجاوز 2 ميغابايت.");
 const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error("تعذرت قراءة الصورة."));reader.readAsDataURL(file);});
 return {mime_type:file.type,base64:dataUrl.split(",")[1]};
}
$("imageInput").addEventListener("change",()=>{const file=$("imageInput").files[0];const preview=$("imagePreview");if(!file){preview.hidden=true;preview.removeAttribute("src");return;}if(file.size>2*1024*1024||!["image/jpeg","image/png"].includes(file.type)){showNotice("اختر JPG أو PNG حتى 2 ميغابايت.");$("imageInput").value="";preview.hidden=true;return;}preview.src=URL.createObjectURL(file);preview.hidden=false;clearNotice();});

// عرض التنبيهات

function showNotice(message,type="error"){

const box = $("notice");

box.textContent = message;

box.className = "notice " + type;

}

function clearNotice(){

$("notice").textContent = "";

$("notice").className = "notice";

}

// الاتصال بالخادم

async function api(payload){

const response = await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
},

body:JSON.stringify(payload)

});

const data = await response.json().catch(()=>({

error:"تعذر قراءة استجابة الخادم"

}));

if(!response.ok){

throw new Error(
data.error || "تعذر تنفيذ الطلب"
);

}

return data;

}

// إظهار واجهة المحادثة

function showChat(chat){

$("startArea").style.display = "none";

$("chatArea").style.display = "block";

$("chatTitle").textContent =
"محادثة " + chat.visitor_name;

clearNotice();

}

// عرض الرسائل

function renderMessages(messages){

const signature =
messages.map(m=>m.id).join("|");

if(signature === lastRendered)return;

lastRendered = signature;

const box = $("messages");

box.replaceChildren();

messages.forEach(message=>{

const item = document.createElement("div");

item.className =
"msg " +
(message.sender_type === "doctor"
? "doctor"
: "visitor");

const meta = document.createElement("div");

meta.className = "meta";

meta.textContent =
(message.sender_type === "doctor"
? "طبيب الطوارئ"
: "أنت")
+
" • "
+
new Date(message.created_at).toLocaleTimeString(
"ar-IQ",
{
hour:"2-digit",
minute:"2-digit"
}
);

const content = document.createElement("div");

content.textContent = message.message;

item.append(meta,content);
if(message.attachment_url){const image=document.createElement("img");image.className="attachment-image";image.alt="صورة مرفقة";image.referrerPolicy="no-referrer";image.src=message.attachment_url;item.append(image);}

box.append(item);

});

box.scrollTop = box.scrollHeight;

}

// تحميل الرسائل

async function refreshMessages(){

if(!chatId || !accessToken)return;

try{

const data = await api({

action:"visitor_get",

chat_id:chatId,

access_token:accessToken

});

renderMessages(data.messages || []);

}catch(error){

showNotice(error.message);

stopPolling();

}

}

// تحديث الرسائل تلقائياً

function startPolling(){

stopPolling();

refreshMessages();

pollHandle = setInterval(
refreshMessages,
3500
);

}

function stopPolling(){

if(pollHandle){

clearInterval(pollHandle);

}

pollHandle = null;

}

// إنشاء محادثة جديدة

$("startForm").addEventListener(
"submit",
async function(event){

event.preventDefault();

clearNotice();

const name = $("visitorName").value.trim();

if(name.length < 2){

showNotice("يرجى كتابة اسمك بشكل صحيح.");

return;

}

const button = $("startButton");

button.disabled = true;

button.textContent = "جارٍ إنشاء المحادثة...";

try{

const data = await api({

action:"create_chat",

name:name

});

chatId = data.chat.id;

accessToken = data.access_token;

// الاحتفاظ بالمحادثة في الجلسة الحالية

sessionStorage.setItem(
"patient_emergency_chat",
JSON.stringify({

chat_id:chatId,

access_token:accessToken,

visitor_name:data.chat.visitor_name

})
);

lastRendered = "";

showChat(data.chat);

startPolling();

}catch(error){

showNotice(error.message);

}finally{

button.disabled = false;

button.textContent = "ابدأ المحادثة";

}

});

// إرسال رسالة

$("sendForm").addEventListener(
"submit",
async function(event){

event.preventDefault();

const message =
$("messageInput").value.trim();

const file=$("imageInput").files[0];
if(!message&&!file)return;

const button = $("sendButton");

button.disabled = true;

try{

await api({

action:"visitor_send",

chat_id:chatId,

access_token:accessToken,

message:message,
attachment:await readAttachment(file)

});

$("messageInput").value = "";
$("imageInput").value = "";
$("imagePreview").hidden = true;
$("imagePreview").removeAttribute("src");

await refreshMessages();

}catch(error){

showNotice(error.message);

}finally{

button.disabled = false;

}

});

// بدء محادثة جديدة

$("newChatButton").addEventListener(
"click",
function(){

stopPolling();

sessionStorage.removeItem(
"patient_emergency_chat"
);

chatId = null;

accessToken = null;

lastRendered = "";

$("chatArea").style.display = "none";

$("startArea").style.display = "block";

$("messages").replaceChildren();

clearNotice();

});

// استعادة المحادثة عند إعادة تحميل الصفحة

function resumeSaved(){

try{

const saved = JSON.parse(

sessionStorage.getItem(
"patient_emergency_chat"
) || "null"

);

if(
saved &&
saved.chat_id &&
saved.access_token
){

chatId = saved.chat_id;

accessToken = saved.access_token;

showChat({

visitor_name:
saved.visitor_name || "المراجع"

});

startPolling();

}

}catch(error){

console.error(error);

}

}

resumeSaved();

</script>

</body>
</html>
