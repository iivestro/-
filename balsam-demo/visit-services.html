<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>خدمات بلسم | BALSAM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2.49.4"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3faf9;color:#153b49;font:16px/1.75 Tahoma,Arial,sans-serif}header{background:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #cde5e1}header strong{color:#08777e}a{color:#075b62;font-weight:bold}main{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#125863,#08777e);border-radius:22px;padding:24px;color:#fff}.hero h1{margin:0;font-size:25px}.hero p{margin:8px 0}section{background:#fff;border:1px solid #cde5e1;border-radius:18px;padding:18px;margin-top:16px}#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}button,input,textarea{font:inherit;min-height:44px;border:1px solid #99c9c7;border-radius:10px;padding:10px;max-width:100%}button{background:#e4f3f1;color:#075b62;font-weight:bold;cursor:pointer}button.primary{background:#08777e;color:#fff}button:disabled{opacity:.55}form{display:grid;gap:8px;margin:12px 0}label{font-weight:bold}textarea{resize:vertical}.item{background:#f4faf9;border:1px solid #cde5e1;border-radius:14px;padding:15px;margin:10px 0;overflow-wrap:anywhere}.item p{margin:5px 0}.item button{margin:5px}.muted{color:#48666a}.num{font-size:32px;color:#08777e;font-weight:bold}[hidden]{display:none!important}#notice{color:#075b62;min-height:1.5em}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1495b2;outline-offset:2px}
</style><meta name="application-name" content="بلسم"><meta name="apple-mobile-web-app-title" content="بلسم"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/balsam-icon.svg"><link rel="apple-touch-icon" href="./assets/balsam-192.png"><link rel="stylesheet" href="./balsam-theme.css?v=20261126a">
</head><body><div dir="rtl" style="position:sticky;top:0;z-index:99999;padding:9px 12px;background:#fff4d6;color:#6b4610;border-bottom:1px solid #e8c766;text-align:center;font:700 13px/1.5 Arial,sans-serif">⚠️ نسخة بلسم التجريبية — بيانات تدريب فقط، لا تُدخل معلومات مرضى حقيقية</div><header><strong>بلسم | BALSAM</strong><a id="back" href="index.html">العودة إلى البوابة</a></header><main><div class="hero"><h1>خدمات بلسم</h1><p>الدعم الفني، الدور الإلكتروني، أقرب الأطباء والمراكز، وتذكير المواعيد.</p></div><section><p id="account" role="status">جارٍ التحقق من الحساب…</p><div id="menu"></div></section><section id="panel" hidden><h2 id="heading"></h2><p class="muted" id="description"></p><form id="form"></form><div id="results"></div><p id="notice" role="status" aria-live="polite"></p></section></main>
<script>
'use strict';
const db=window.supabase.createClient('https://sfaatbfiwwbvobpvhwxo.supabase.co','sb_publishable_CBPPwjIcmVbGK1fr8EHyYg_DlfldbK6');
const $=id=>document.getElementById(id), node=(tag,t)=>{const e=document.createElement(tag);if(t!==undefined)e.textContent=t;return e;};
const say=t=>{$('notice').textContent=t;};
const titles={support_list:'الدعم الفني وطلباتي',support_create:'إرسال طلب دعم فني',queue_my:'دوري الإلكتروني',queue_bookings:'تسجيل حضور المراجعين',queue_provider:'إدارة الدور اليوم',nearby:'الأطباء والمراكز بالقرب مني',visit_reminders:'تذكير المواعيد',visit_notifications:'الإشعارات',geo_providers:'تحديد مواقع العيادات والمراكز'};
const states={waiting:'بانتظار الدور',called:'حان الدور',completed:'مكتمل',cancelled:'ملغى',open:'بانتظار الرد',answered:'تم الرد',closed:'مغلق',doctor:'طبيب',center:'مركز طبي',approved:'مؤكد',confirmed:'مؤكد'};
const names={title:'الإشعار',message:'التفاصيل',current_number:'الدور الحالي',subject:'عنوان الطلب',body:'التفاصيل',status:'الحالة',reply:'رد الإدارة',patient_name:'اسم المراجع',provider_name:'مقدم الخدمة',kind:'نوع الخدمة',state:'الحالة',ahead:'عدد المراجعين قبلك',queue_number:'رقم الدور',appointment_at:'موعد الحضور',service_date:'تاريخ الزيارة',distance_km:'المسافة الجوية (كم)',created_at:'تاريخ الطلب'};
let role='',selected='',busy=false,userId='';
function button(t,fn,primary=false){const b=node('button',t);b.type='button';if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function field(form,key,label,options={}){const l=node('label',label);l.htmlFor='f-'+key+'-'+Math.random().toString(36).slice(2);const i=node(options.area?'textarea':'input');i.id=l.htmlFor;i.name=key;i.required=true;i.value=options.value??'';if(options.area){i.rows=4;i.maxLength=2000;}else{i.type=options.type??'text';if(options.type==='number')i.step='any';else i.maxLength=options.max??120;}form.append(l,i);return i;}
function submit(form,t,fn){const b=node('button',t);b.className='primary';b.type='submit';form.append(b);form.addEventListener('submit',e=>{e.preventDefault();if(!busy)fn(new FormData(form));});}
function format(k,v){if(v===null||v===undefined)return '—';if(['appointment_at','created_at'].includes(k)){const dt=new Date(v);if(Number.isFinite(dt.valueOf()))return new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',dateStyle:'medium',timeStyle:'short'}).format(dt);}return states[v]??String(v);}
async function run(action,data={},next=action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);say('جارٍ التنفيذ…');try{const r=await db.rpc('patient_visit_action',{p_action:action,p_data:data});if(r.error)throw r.error;let rows=r.data;if(next!==action){const rr=await db.rpc('patient_visit_action',{p_action:next,p_data:{}});if(rr.error){say('تم تنفيذ الطلب. حدّث القائمة لعرض النتائج.');return;}rows=rr.data;selected=next;setup(next);}render(rows);say('تم التحديث.');}catch(e){say(e?.code==='42501'?'الخدمة غير متاحة لهذا الحساب أو انتهت جلسة الدخول.':e?.code==='22023'?'تعذر التنفيذ. تحقق من البيانات وانتظر قبل المحاولة مرة أخرى.':'تعذر الاتصال بالخدمة. حاول مجدداً.');}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function setup(a){selected=a;$('panel').hidden=false;$('heading').textContent=titles[a];$('form').replaceChildren();$('results').replaceChildren();say('');const f=$('form');
$('description').textContent=a==='nearby'?'نستخدم موقعك فقط لهذا البحث. المسافة جوية تقريبية، وتظهر فقط العيادات التي سجلت الإدارة مواقعها.':a==='visit_reminders'?'المواعيد المؤكدة خلال 24 ساعة. التذكير داخل المنصة، وليس رسالة واتساب أو إشعار هاتف خارجي.':a==='support_create'?'لا تكتب معلومات طبية أو كلمات مرور في تذكرة الدعم.':a==='queue_my'?'يُصدر رقم الدور عند تسجيل حضورك من الطبيب أو المركز.':a==='geo_providers'?'أدخل إحداثيات موقع العيادة الحقيقي بعد التحقق منه.':'';
if(a==='support_create'){field(f,'subject','عنوان المشكلة');field(f,'body','تفاصيل المشكلة',{area:true});submit(f,'إرسال طلب الدعم',d=>run('support_create',{subject:d.get('subject'),body:d.get('body')},'support_list'));}
else if(a==='nearby'){f.append(button('استخدام موقعي والبحث',()=>{if(!navigator.geolocation){say('تحديد الموقع غير متاح.');return;}say('يرجى السماح باستخدام الموقع.');navigator.geolocation.getCurrentPosition(p=>run('nearby',{latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>say('تعذر تحديد الموقع. تحقق من الأذونات.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000});},true));}
else f.append(button('تحديث القائمة',()=>run(a)));
}
function choose(a){if(busy)return;setup(a);if(!['support_create','nearby'].includes(a))run(a);}
function render(rows){const box=$('results');box.replaceChildren();if(!Array.isArray(rows)){box.append(node('p','تم تنفيذ الطلب.'));return;}if(!rows.length){box.append(node('p',selected==='nearby'?'لا توجد مواقع عيادات مسجلة بالقرب منك حالياً.':'لا توجد نتائج حالياً.'));return;}
for(const r of rows){const card=node('div');card.className='item';if(r.queue_number){const n=node('p','رقم الدور: '+r.queue_number);n.className='num';card.append(n);}for(const [k,v] of Object.entries(r)){if(!names[k]||k==='queue_number')continue;card.append(node('p',names[k]+': '+format(k,v)));}
if(selected==='support_list'&&role==='admin'&&r.status==='open'){const form=node('form');field(form,'reply','رد الإدارة',{area:true});submit(form,'إرسال الرد',d=>run('support_reply',{id:r.id,reply:d.get('reply')},'support_list'));card.append(form);}
if(selected==='queue_bookings')card.append(button('تسجيل الحضور وإصدار الدور',()=>run('queue_checkin',{booking_id:r.id,kind:role==='doctor'?'doctor':'center'},'queue_provider'),true));
if(selected==='queue_provider'&&['waiting','called'].includes(r.state)){card.append(button(r.state==='waiting'?'نداء المراجع':'إنهاء الدور',()=>run('queue_update',{id:r.id,state:r.state==='waiting'?'called':'completed'},'queue_provider'),true),button('إلغاء الدور',()=>{if(confirm('إلغاء هذا الدور؟'))run('queue_update',{id:r.id,state:'cancelled'},'queue_provider');}));}
if(selected==='geo_providers'){const form=node('form');field(form,'latitude','خط العرض',{type:'number',value:r.latitude});field(form,'longitude','خط الطول',{type:'number',value:r.longitude});submit(form,'حفظ موقع العيادة',d=>run('geo_set',{kind:r.kind,provider_id:r.provider_id,latitude:Number(d.get('latitude')),longitude:Number(d.get('longitude'))},'geo_providers'));card.append(form);}
box.append(card);}}
async function start(){try{const lookup=db.auth.getUser();const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('انتهت مهلة التحقق. حاول تحديث الصفحة أو تسجيل الدخول مجدداً.')),10000));const {data,error}=await Promise.race([lookup,timeout]);if(error||!data.user)throw Error();userId=data.user.id;const r=await db.from('profiles').select('role,approval_status').eq('id',userId).maybeSingle();if(r.error||r.data?.approval_status!=='approved')throw Error();role=r.data.role;const links={patient:'patients.html',doctor:'doctor.html',medical_center:'medical-center.html',admin:'admin.html',representative:'representatives.html',home_provider:'home-provider.html'};$('back').href=links[role]??'index.html';$('account').textContent='اختر الخدمة المطلوبة.';const actions=['support_list','support_create','visit_notifications'];if(role==='patient')actions.push('queue_my','nearby','visit_reminders');if(['doctor','medical_center'].includes(role))actions.push('queue_bookings','queue_provider');if(role==='admin')actions.push('geo_providers');for(const a of actions)$('menu').append(button(titles[a],()=>choose(a)));}catch{$('account').textContent='يرجى تسجيل الدخول إلى بوابتك بحساب فعال أولاً.';}}
db.auth.onAuthStateChange((event,session)=>{if(userId&&(!session||session.user.id!==userId)){location.reload();}});
start();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
