
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRAQ MEDICAL | إدارة صور الأطباء</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f8f7;color:#17343b;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
main{width:min(760px,calc(100% - 24px));margin:28px auto}
.card{background:#fff;border:1px solid #e2ece9;border-radius:18px;padding:22px;box-shadow:0 10px 30px #17343b0d;margin-bottom:16px}
h1{font-size:22px;margin:0 0 5px}
p{color:#71858a;font-size:13px;margin-top:0}
label{display:block;font-weight:bold;font-size:13px;margin:13px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #dce7e4;border-radius:10px;background:#fbfdfc;color:#17343b}
button{border:0;border-radius:10px;padding:12px 16px;background:#159b8c;color:#fff;font-weight:bold;cursor:pointer;margin-top:12px;width:100%}
button:disabled{opacity:.5}
.secondary{background:#edf4f2;color:#3e5a5d}
.hidden{display:none!important}
.preview{display:flex;align-items:center;gap:16px;margin-top:15px;padding:13px;background:#f8fcfb;border-radius:13px;border:1px solid #e5efec}
.preview img{width:100px;height:100px;object-fit:cover;border-radius:14px;background:#e2f5f1}
.msg{font-size:13px;color:#147f73;overflow-wrap:anywhere}
.err{color:#b64b59}
</style>
<meta name="application-name" content="بلسم"><meta name="apple-mobile-web-app-title" content="بلسم"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/balsam-icon.svg"><link rel="apple-touch-icon" href="./assets/balsam-192.png"><link rel="stylesheet" href="./balsam-theme.css?v=20261126a">
</head>
<body><div dir="rtl" style="position:sticky;top:0;z-index:99999;padding:9px 12px;background:#fff4d6;color:#6b4610;border-bottom:1px solid #e8c766;text-align:center;font:700 13px/1.5 Arial,sans-serif">⚠️ نسخة بلسم التجريبية — بيانات تدريب فقط، لا تُدخل معلومات مرضى حقيقية</div>
<main>
<section id="login" class="card">
<h1>دخول الإدارة</h1>
<p>هذه الصفحة مخصصة لإدارة صور الأطباء، وتتطلب حساب مدير معتمداً.</p>
<label>البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username">
<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn" onclick="login()">تسجيل الدخول</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="panel" class="card hidden">
<h1>إدارة صور الأطباء</h1>
<p>اختر الطبيب ثم ارفع صورته. الصيغ المقبولة JPG وPNG وWebP، والحد الأقصى 5 ميغابايت.</p>

<label>الطبيب</label>
<select id="doctorSelect">
<option value="">تحميل الأطباء...</option>
</select>

<label>اختيار الصورة</label>
<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp">

<div class="preview">
<img id="preview" alt="معاينة صورة الطبيب">
<div>
<b id="doctorName">اختر طبيباً</b>
<p id="currentInfo">ستظهر معاينة الصورة هنا.</p>
</div>
</div>

<button id="saveBtn" onclick="savePhoto()">رفع وحفظ الصورة</button>
<button class="secondary" id="deleteBtn" onclick="deletePhoto()">حذف صورة الطبيب</button>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
<div id="panelMsg" class="msg"></div>
</section>
</main>

<script>
const SUPABASE_URL="https://sfaatbfiwwbvobpvhwxo.supabase.co";
const SUPABASE_KEY="sb_publishable_CBPPwjIcmVbGK1fr8EHyYg_DlfldbK6";
const BUCKET="doctor-photos";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let doctors=[],selected=null,previewUrl=null;

const fallback="data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" rx="18" fill="#e2f5f1"/><circle cx="60" cy="43" r="21" fill="#9bcfc4"/><path d="M20 112c3-27 18-39 40-39s37 12 40 39" fill="#9bcfc4"/></svg>');

function setMsg(id,t,err=false){
 $(id).textContent=t;
 $(id).classList.toggle("err",err);
}

async function isAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return false;

 const {data,error}=await db.from("profiles")
 .select("role,approval_status")
 .eq("id",user.id).single();

 return !error &&
 data.role==="admin" &&
 data.approval_status==="approved";
}

async function login(){
 const btn=$("loginBtn");
 btn.disabled=true;
 setMsg("loginMsg","جارٍ التحقق...");

 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });

 btn.disabled=false;

 if(error){
  setMsg("loginMsg",error.message,true);
  return;
 }

 if(!await isAdmin()){
  await db.auth.signOut();
  setMsg("loginMsg","هذا الحساب لا يملك صلاحية المدير المعتمد.",true);
  return;
 }

 await showPanel();
}

async function showPanel(){
 $("login").classList.add("hidden");
 $("panel").classList.remove("hidden");
 await loadDoctors();
}

async function loadDoctors(){
 const sel=$("doctorSelect");
 sel.innerHTML='<option value="">اختر الطبيب</option>';

 const {data:ds,error}=await db.from("doctors")
 .select("id,profile_id,photo_url")
 .order("created_at",{ascending:false});

 if(error){
  setMsg("panelMsg","تعذر تحميل الأطباء: "+error.message,true);
  return;
 }

 doctors=ds||[];
 const ids=doctors.map(d=>d.profile_id).filter(Boolean);
 let profiles=[];

 if(ids.length){
  const r=await db.from("profiles")
  .select("id,full_name,role")
  .in("id",ids);

  if(r.error){
   setMsg("panelMsg","تعذر تحميل أسماء الأطباء: "+r.error.message,true);
   return;
  }

  profiles=r.data||[];
 }

 doctors=doctors.map(d=>({
  ...d,
  profile:profiles.find(p=>p.id===d.profile_id)
 })).filter(d=>d.profile?.role==="doctor");

 doctors.forEach(d=>{
  const o=document.createElement("option");
  o.value=d.id;
  o.textContent=d.profile.full_name||"طبيب";
  sel.appendChild(o);
 });

 sel.onchange=()=>selectDoctor(sel.value);

 if(doctors.length){
  setMsg("panelMsg","تم تحميل "+doctors.length+" طبيباً.");
 }else{
  setMsg("panelMsg","لم يتم العثور على أطباء.");
 }
}

function selectDoctor(id){
 selected=doctors.find(d=>d.id===id)||null;
 $("doctorName").textContent=selected?.profile?.full_name||"اختر طبيباً";
 $("preview").src=selected?.photo_url||fallback;
 $("currentInfo").textContent=selected?.photo_url?
 "توجد صورة محفوظة حالياً.":"لا توجد صورة محفوظة لهذا الطبيب.";
 setMsg("panelMsg","");
}

$("photoFile").addEventListener("change",()=>{
 const f=$("photoFile").files[0];

 if(previewUrl)URL.revokeObjectURL(previewUrl);
 previewUrl=null;

 if(!f){
  $("preview").src=selected?.photo_url||fallback;
  return;
 }

 if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>5242880){
  setMsg("panelMsg","اختر JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميغابايت.",true);
  $("photoFile").value="";
  return;
 }

 previewUrl=URL.createObjectURL(f);
 $("preview").src=previewUrl;
});

function oldObjectPath(url){
 if(!url)return null;
 const marker="/storage/v1/object/public/"+BUCKET+"/";
 const i=url.indexOf(marker);
 return i<0?null:decodeURIComponent(url.slice(i+marker.length));
}

async function savePhoto(){
 if(!selected){
  setMsg("panelMsg","اختر الطبيب أولاً.",true);
  return;
 }

 const file=$("photoFile").files[0];

 if(!file){
  setMsg("panelMsg","اختر صورة قبل الحفظ.",true);
  return;
 }

 if(!await isAdmin()){
  setMsg("panelMsg","انتهت الجلسة أو لا تملك صلاحية المدير.",true);
  return;
 }

 const btn=$("saveBtn");
 btn.disabled=true;
 setMsg("panelMsg","جارٍ رفع الصورة...");

 try{
  const ext=file.type==="image/png"?"png":
  file.type==="image/webp"?"webp":"jpg";

  const path=selected.id+"/"+Date.now()+"."+ext;

  const {error:upErr}=await db.storage.from(BUCKET).upload(
   path,file,{
    upsert:false,
    contentType:file.type,
    cacheControl:"3600"
   }
  );

  if(upErr)throw upErr;

  const {data:urlData}=db.storage.from(BUCKET).getPublicUrl(path);

  const {error:dbErr}=await db.from("doctors")
  .update({photo_url:urlData.publicUrl})
  .eq("id",selected.id);

  if(dbErr){
   await db.storage.from(BUCKET).remove([path]);
   throw dbErr;
  }

  const old=oldObjectPath(selected.photo_url);

  if(old&&old!==path){
   await db.storage.from(BUCKET).remove([old]);
  }

  selected.photo_url=urlData.publicUrl;
  $("preview").src=urlData.publicUrl;
  $("currentInfo").textContent="تم حفظ الصورة بنجاح.";
  $("photoFile").value="";

  setMsg("panelMsg","تم رفع صورة الطبيب وحفظها بنجاح. ستظهر في بوابة المراجعين بعد تحديث الصفحة.");

 }catch(e){
  setMsg("panelMsg","تعذر حفظ الصورة: "+(e.message||e),true);
 }finally{
  btn.disabled=false;
 }
}

async function deletePhoto(){
 if(!selected){
  setMsg("panelMsg","اختر الطبيب أولاً.",true);
  return;
 }

 if(!selected.photo_url){
  setMsg("panelMsg","لا توجد صورة لحذفها.");
  return;
 }

 if(!confirm("هل تريد حذف صورة هذا الطبيب؟"))return;

 if(!await isAdmin()){
  setMsg("panelMsg","لا تملك صلاحية المدير.",true);
  return;
 }

 $("deleteBtn").disabled=true;

 try{
  const path=oldObjectPath(selected.photo_url);

  if(path){
   const {error}=await db.storage.from(BUCKET).remove([path]);
   if(error)throw error;
  }

  const {error}=await db.from("doctors")
  .update({photo_url:null})
  .eq("id",selected.id);

  if(error)throw error;

  selected.photo_url=null;
  $("preview").src=fallback;
  $("currentInfo").textContent="تم حذف الصورة.";
  setMsg("panelMsg","تم حذف صورة الطبيب.");

 }catch(e){
  setMsg("panelMsg","تعذر حذف الصورة: "+(e.message||e),true);
 }finally{
  $("deleteBtn").disabled=false;
 }
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(async({data})=>{
 if(data.session){
  if(await isAdmin()){
   await showPanel();
  }else{
   await db.auth.signOut();
  }
 }
});
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body>
</html>
