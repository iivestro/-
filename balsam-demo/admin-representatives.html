<body>
<div class="balsam-staging-banner" role="note"><strong>نسخة تدريب منفصلة</strong> — استخدم بيانات اختبار فقط، ولا ترفع تقارير أو معلومات طبية حقيقية.</div>
<header>
 <div class="brand">بلسم | BALSAM</div>
 <div>لوحة إدارة المندوبين</div>
</header>
<main>
 <section class="card" id="loginBox">
  <h2>دخول المدير</h2>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button id="loginBtn" onclick="login()">تسجيل الدخول</button>
  <p id="loginError" class="error"></p>
 </section>

 <section id="panel" class="hidden">
  <div class="card">
   <div class="top">
    <div>
     <h2>إدارة حسابات المندوبين</h2>
     <p>قبول الحسابات أو رفضها أو تعليقها وإعادة تفعيلها.</p>
    </div>
    <button class="light" onclick="loadRepresentatives()">تحديث القائمة</button>
   </div>
   <input id="search" placeholder="ابحث باسم المندوب أو جهة العمل أو المحافظة..." oninput="render()">
   <p id="message"></p>
   <p id="error" class="error"></p>
   <div class="grid" id="list"></div>
  </div>
 </section>
</main>
<script>
const URL="https://sfaatbfiwwbvobpvhwxo.supabase.co";
const KEY="sb_publishable_CBPPwjIcmVbGK1fr8EHyYg_DlfldbK6";
const db=window.supabase.createClient(URL,KEY);
let reps=[];

const $=id=>document.getElementById(id);
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function label(s){
 return ({pending:"بانتظار الموافقة",approved:"معتمد",rejected:"مرفوض",suspended:"موقوف"})[s]||s;
}
async function isAdmin(user){
 const {data,error}=await db.from("profiles")
  .select("role,approval_status").eq("id",user.id).single();
 return !error&&data?.role==="admin"&&data?.approval_status==="approved";
}
async function login(){
 $("loginError").textContent="";
 $("loginBtn").disabled=true;
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:$("email").value.trim(),password:$("password").value
  });
  if(error)throw error;
  if(!await isAdmin(data.user)){
   await db.auth.signOut();
   throw new Error("هذا الحساب لا يملك صلاحية المدير.");
  }
  await openPanel();
 }catch(e){$("loginError").textContent=e.message;}
 finally{$("loginBtn").disabled=false;}
}
async function openPanel(){
 $("loginBox").classList.add("hidden");
 $("panel").classList.remove("hidden");
 await loadRepresentatives();
}
async function loadRepresentatives(){
 $("error").textContent="";
 $("list").innerHTML="<p>جارٍ تحميل المندوبين...</p>";
 const {data,error}=await db.from("rep_accounts")
  .select("profile_id,employer_type,employer_name,status,created_at,profiles!rep_accounts_profile_id_fkey(full_name,governorate,approval_status)")
  .order("created_at",{ascending:false});
 if(error){
  $("list").innerHTML="";
  $("error").textContent="تعذر تحميل القائمة: "+error.message;
  return;
 }
 reps=data||[];
 const ids=reps.map(r=>r.profile_id);
 if(ids.length){
  const result=await db.rpc("admin_get_profile_phones",{p_profile_ids:ids});
  if(result.error){
   $("error").textContent="تم تحميل المندوبين، لكن تعذر تحميل أرقام الهواتف: "+result.error.message;
  }else{
   const map=new Map((result.data||[]).map(x=>[x.profile_id,x.phone]));
   reps=reps.map(r=>({...r,phone:map.get(r.profile_id)||"غير مسجل"}));
  }
 }
 render();
}
function render(){
 const term=$("search").value.trim().toLowerCase();
 const rows=reps.filter(r=>{
  const p=r.profiles||{};
  return [p.full_name,r.employer_name,p.governorate,r.phone]
   .some(x=>String(x||"").toLowerCase().includes(term));
 });
 if(!rows.length){
  $("list").innerHTML="<div class='rep'>لا توجد حسابات مطابقة.</div>";
  return;
 }
 $("list").innerHTML=rows.map(r=>{
  const p=r.profiles||{};
  const status=r.status||"pending";
  const kind=r.employer_type==="company"?"شركة":"مكتب علمي";
  let actions="";
  if(status==="pending"){
   actions=`<button onclick="changeStatus('${r.profile_id}','approved',this)">قبول المندوب</button>
   <button class="reject" onclick="changeStatus('${r.profile_id}','rejected',this)">رفض الحساب</button>`;
  }else if(status==="approved"){
   actions=`<button class="suspend" onclick="changeStatus('${r.profile_id}','suspended',this)">تعليق الحساب</button>`;
  }else{
   actions=`<button onclick="changeStatus('${r.profile_id}','approved',this)">إعادة تفعيل الحساب</button>
   <button class="reject" onclick="changeStatus('${r.profile_id}','rejected',this)">رفض الحساب</button>`;
  }
  const date=r.created_at?new Date(r.created_at).toLocaleDateString("ar-IQ"):"—";
  return `<article class="rep">
   <h3>${esc(p.full_name||"مندوب بدون اسم")}</h3>
   <div class="meta">
    <div>الهاتف: ${esc(r.phone||"غير مسجل")}</div>
    <div>المحافظة: ${esc(p.governorate||"غير محددة")}</div>
    <div>جهة العمل: ${esc(kind)} — ${esc(r.employer_name)}</div>
    <div>تاريخ التسجيل: ${esc(date)}</div>
    <div>الحالة: <span class="status ${esc(status)}">${esc(label(status))}</span></div>
   </div>
   <div class="actions">${actions}</div>
  </article>`;
 }).join("");
}
async function changeStatus(id,status,button){
 const prompts={
  approved:"هل تريد اعتماد هذا المندوب والسماح له باستخدام بوابة المندوبين؟",
  rejected:"هل تريد رفض حساب هذا المندوب؟",
  suspended:"هل تريد تعليق حساب هذا المندوب؟"
 };
 if(!confirm(prompts[status]))return;
 button.disabled=true;
 $("message").textContent="جارٍ تحديث حالة المندوب...";
 $("error").textContent="";
 try{
  const {data,error}=await db.rpc("admin_set_representative_status",{
   p_profile_id:id,p_status:status
  });
  if(error)throw error;
  if(data!==true)throw new Error("لم يتم تأكيد تحديث الحالة.");
  $("message").textContent="تم تحديث حالة المندوب بنجاح.";
  await loadRepresentatives();
 }catch(e){
  $("message").textContent="";
  $("error").textContent="تعذر تحديث الحالة: "+e.message;
  button.disabled=false;
 }
}
db.auth.getSession().then(async({data})=>{
 const user=data.session?.user;
 if(user&&await isAdmin(user))await openPanel();
});
</script>
</body>
</html>
